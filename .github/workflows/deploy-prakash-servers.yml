name: Deploy (Prakash)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-prakash-main
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVER_1_IP: 94.130.13.115
  SERVER_2_IP: 88.99.151.102
  SERVER_3_IP: 138.201.129.173
  APP_DIR: /home/deploy/storj-interface
  HOST_PORT: 3005
  PREVIEW_URL: https://storage-interface.prakash.yral.com

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ffmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libswresample-dev \
            clang pkg-config

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:cache-main
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:cache-main,mode=max

  deploy:
    name: Deploy HA to All Nodes
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: Deployment
    permissions:
      contents: read
      packages: read
      id-token: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
      REPLICATOR_PASSWORD: ${{ secrets.REPLICATOR_PASSWORD }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      PATRONI_API_PASSWORD: ${{ secrets.PATRONI_API_PASSWORD }}
      STORJ_ACCESS_GRANT: ${{ secrets.STORJ_ACCESS_GRANT }}
      STORJ_ACCESS_GRANT_NSFW: ${{ secrets.STORJ_ACCESS_GRANT_NSFW }}
      HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
      HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
      HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
      SERVICE_SECRET_TOKEN: ${{ secrets.SERVICE_SECRET_TOKEN }}
      STORJ_EU1_GATEWAY_ACCESS_KEY: ${{ secrets.STORJ_EU1_GATEWAY_ACCESS_KEY }}
      STORJ_EU1_GATEWAY_SECRET_KEY: ${{ secrets.STORJ_EU1_GATEWAY_SECRET_KEY }}
      STORJ_MIRROR_ACCESS_GRANT: ${{ secrets.STORJ_MIRROR_ACCESS_GRANT }}
      SFW_SHARE_EU1_URL: ${{ secrets.SFW_SHARE_EU1_URL }}
      VIDEOGEN_RABBITMQ_PUBLISHER_PASSWORD: ${{ secrets.VIDEOGEN_RABBITMQ_PUBLISHER_PASSWORD }}
      VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64: ${{ secrets.VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64 }}
      VIDEOGEN_SERVICE_AUTH_TOKEN: ${{ secrets.VIDEOGEN_SERVICE_AUTH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PRAKASH }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: yral-video-storage-service-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/yral-video-storage-service/BACKEND_ADMIN_IDENTITY value | BACKEND_ADMIN_IDENTITY ;
            secret/data/yral-video-storage-service/INTERNAL_ENCRYPTION_SECRET value | INTERNAL_ENCRYPTION_SECRET ;
            secret/data/yral-video-storage-service/MODERATION_HMAC_SECRET value | MODERATION_HMAC_SECRET ;

      - name: Deploy HA to all nodes
        run: |
          declare -A SERVERS
          SERVERS=(["server_1"]="${SERVER_1_IP}" ["server_2"]="${SERVER_2_IP}" ["server_3"]="${SERVER_3_IP}")

          for NODE_NAME in server_1 server_2 server_3; do
            NODE_IP="${SERVERS[$NODE_NAME]}"
            echo "--> ${NODE_NAME} (${NODE_IP})"
            ssh-keyscan -H "${NODE_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

            ssh "deploy@${NODE_IP}" "mkdir -p ${APP_DIR}"
            scp -r deploy "deploy@${NODE_IP}:${APP_DIR}/"

            RUN_APP=false
            [[ "${NODE_NAME}" == "server_1" ]] && RUN_APP=true

            APP_VARS=""
            if [[ "${RUN_APP}" == "true" ]]; then
              APP_VARS="\
                export STORJ_ACCESS_GRANT_SFW='${STORJ_ACCESS_GRANT}'; \
                export STORJ_ACCESS_GRANT_NSFW='${STORJ_ACCESS_GRANT_NSFW}'; \
                export HETZNER_S3_ENDPOINT='${HETZNER_S3_ENDPOINT}'; \
                export HETZNER_S3_BUCKET='${HETZNER_S3_BUCKET}'; \
                export HETZNER_S3_ACCESS_KEY='${HETZNER_S3_ACCESS_KEY}'; \
                export HETZNER_S3_SECRET_KEY='${HETZNER_S3_SECRET_KEY}'; \
                export HETZNER_S3_REGION='${HETZNER_S3_REGION}'; \
                export SERVICE_SECRET_TOKEN='${SERVICE_SECRET_TOKEN}'; \
                export STORJ_EU1_GATEWAY_ACCESS_KEY='${STORJ_EU1_GATEWAY_ACCESS_KEY}'; \
                export STORJ_EU1_GATEWAY_SECRET_KEY='${STORJ_EU1_GATEWAY_SECRET_KEY}'; \
                export STORJ_MIRROR_ACCESS_GRANT='${STORJ_MIRROR_ACCESS_GRANT}'; \
                export SFW_BUCKET='yral-sfw'; \
                export NSFW_BUCKET='yral-nsfw-videos'; \
                export SFW_SHARE_EU1_URL='${SFW_SHARE_EU1_URL}'; \
                export VIDEOGEN_VAST_SUBMIT_TRANSPORT='rabbitmq'; \
                export VIDEOGEN_UPLOAD_SERVICE_URL='https://upload.yral.com'; \
                export MODERATION_MODE='remote'; \
                export VIDEOGEN_RABBITMQ_PUBLISHER_PASSWORD='${VIDEOGEN_RABBITMQ_PUBLISHER_PASSWORD}'; \
                export VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64='${VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64}'; \
                export VIDEOGEN_SERVICE_AUTH_TOKEN='${VIDEOGEN_SERVICE_AUTH_TOKEN}'; \
                export BACKEND_ADMIN_IDENTITY='${BACKEND_ADMIN_IDENTITY}'; \
                export INTERNAL_ENCRYPTION_SECRET='${INTERNAL_ENCRYPTION_SECRET}'; \
                export MODERATION_HMAC_SECRET='${MODERATION_HMAC_SECRET}'; \
                export PUBLIC_BASE_URL='https://storage-interface.prakash.yral.com'; \
                export ENVIRONMENT='production';"
            fi

            ssh "deploy@${NODE_IP}" \
              "export SERVER_1_IP='${SERVER_1_IP}'; \
               export SERVER_2_IP='${SERVER_2_IP}'; \
               export SERVER_3_IP='${SERVER_3_IP}'; \
               export NODE_NAME='${NODE_NAME}'; \
               export NODE_IP='${NODE_IP}'; \
               export POSTGRES_SUPERUSER_PASSWORD='${POSTGRES_SUPERUSER_PASSWORD}'; \
               export REPLICATOR_PASSWORD='${REPLICATOR_PASSWORD}'; \
               export APP_DB_PASSWORD='${APP_DB_PASSWORD}'; \
               export PATRONI_API_PASSWORD='${PATRONI_API_PASSWORD}'; \
               export IMAGE_TAG='${{ github.sha }}'; \
               export APP_IMAGE='ghcr.io/${{ env.IMAGE_NAME }}'; \
               export RUN_APP='${RUN_APP}'; \
               export HOST_PORT='${HOST_PORT}'; \
               ${APP_VARS} \
               echo '${GITHUB_TOKEN}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
               bash '${APP_DIR}/deploy/scripts/deploy/deploy-ha.sh'"
          done

      - name: Health check
        run: |
          ssh-keyscan -H "${SERVER_1_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "deploy@${SERVER_1_IP}" \
            "curl --fail --retry 30 --retry-delay 5 --retry-all-errors \
              http://localhost:${HOST_PORT}/health" || \
          (ssh "deploy@${SERVER_1_IP}" \
            "cd ${APP_DIR}/deploy && COMPOSE_PROJECT_NAME=yral-video-storage-service docker compose -f docker-compose.ha.yml logs --tail=50 storj-interface 2>/dev/null" && exit 1)

  e2e-tests:
    name: E2E Tests
    needs: deploy
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit
    with:
      preview_url: https://storage-interface.prakash.yral.com
      publisher: testuser-${{ github.sha }}

  deployment-summary:
    name: Deployment Summary
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions: {}
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## Production Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ghcr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** ${{ env.PREVIEW_URL }}" >> $GITHUB_STEP_SUMMARY
          echo "**Nodes:** server_1 (${{ env.SERVER_1_IP }}), server_2 (${{ env.SERVER_2_IP }}), server_3 (${{ env.SERVER_3_IP }})" >> $GITHUB_STEP_SUMMARY
          echo "**App:** server_1 only (port ${{ env.HOST_PORT }})" >> $GITHUB_STEP_SUMMARY
