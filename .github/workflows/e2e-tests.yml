name: nightwatch tests
on:
  workflow_call: 
    inputs:
      preview_url:
        type: string
        required: true
      publisher:
        type: string
        required: true

jobs:
  tests: 
    name: E2E Tests
    runs-on: ubuntu-latest
    env:
      HURL_host: ${{ inputs.preview_url }}
      HURL_publisher: ${{ inputs.publisher }}
      HURL_sfw_share: ${{ secrets.SFW_SHARE }}
      HURL_nsfw_share: ${{ secrets.NSFW_SHARE_EU1_URL }}
      HURL_video_id: 7ec40a0b9aba4307a97e8666822ed563
      HURL_hls_video_id: hls_test_7ec40a0b9aba4307a97e8666822ed563
      ACCESS_SFW: ${{ secrets.STORJ_MIRROR_ACCESS_GRANT }}
      ACCESS_NSFW: ${{ secrets.STORJ_ACCESS_GRANT_NSFW }}

    environment: Deployment
    steps:
      - uses: actions/checkout@v3

      - name: Install jq and ffmpeg
        run: |
          sudo apt-get update -q
          sudo apt-get install -y jq ffmpeg

      - name: Install hurl
        run: |
          HURL_VERSION=$(curl -s https://api.github.com/repos/Orange-OpenSource/hurl/releases/latest | jq -r '.tag_name')
          curl -fsSL "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb" -o /tmp/hurl.deb
          sudo dpkg -i /tmp/hurl.deb

      - name: Install uplink
        run: |
          curl -L https://github.com/storj/storj/releases/latest/download/uplink_linux_amd64.zip -o uplink_linux_amd64.zip
          unzip -o uplink_linux_amd64.zip
          sudo install uplink /usr/local/bin/uplink

      - name: Create hurl variables file
        run: |
          {
            echo "host=$HURL_host"
            echo "publisher=$HURL_publisher"
            echo "sfw_share=${{ secrets.SFW_SHARE }}"
            echo "nsfw_share=${{ secrets.NSFW_SHARE_EU1_URL }}"
            echo "video_id=$HURL_video_id"
            echo "hls_video_id=$HURL_hls_video_id"
          } > /tmp/hurl.vars
          # Append HMAC-SHA256 auth variables (hmac_ts, hmac_sig_dup, etc.)
          chmod +x scripts/generate-hmac-vars.sh
          ./scripts/generate-hmac-vars.sh "${{ secrets.SERVICE_SECRET_TOKEN }}" /tmp/hurl.vars

      - name: Run duplication tests
        run: |
          hurl --test --variables-file /tmp/hurl.vars test/duplicate.hurl
          hurl --test --variables-file /tmp/hurl.vars test/duplicate_raw_multipart.hurl
          hurl --test --variables-file /tmp/hurl.vars test/confirm_duplicate.hurl

      - name: Ensure metadata exists
        run: |
          sleep 1s
          # Check metadata for both SFW and NSFW videos in Storj (from /duplicate endpoint)
          # SFW videos now go to both Storj and Hetzner
          uplink meta get --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/$HURL_video_id.mp4"
          uplink meta get --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/$HURL_video_id.mp4" | jq -e 'select(.test == "value")'
          uplink meta get --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/$HURL_video_id.mp4"
          uplink meta get --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/$HURL_video_id.mp4" | jq -e 'select(.test == "value")'

          # Verify raw multipart uploaded videos exist and check metadata
          uplink meta get --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/${HURL_video_id}_raw_mp.mp4"
          uplink meta get --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/${HURL_video_id}_raw_mp.mp4" | jq -e 'select(.test == "multipart")'
          uplink meta get --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/${HURL_video_id}_raw_mp_nsfw.mp4"
          uplink meta get --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/${HURL_video_id}_raw_mp_nsfw.mp4" | jq -e 'select(.test == "multipart")'

          # Verify thumbnails were created for /duplicate endpoint
          echo "Checking thumbnails exist for /duplicate endpoint..."
          uplink ls --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/${HURL_video_id}_thumbnail.png"
          uplink ls --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/${HURL_video_id}_thumbnail.png"

          # Verify thumbnails were created for multipart uploads
          echo "Checking thumbnails exist for multipart uploads..."
          uplink ls --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/${HURL_video_id}_raw_mp_thumbnail.png"
          uplink ls --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/${HURL_video_id}_raw_mp_nsfw_thumbnail.png"

      - name: Setup for move2nsfw tests
        run: |
          uplink rm --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/$HURL_video_id.mp4"

      - name: Run move2nsfw tests
        run: |
          hurl --test --variables-file /tmp/hurl.vars test/move.hurl
          hurl --test --variables-file /tmp/hurl.vars test/confirm_move.hurl

      - name: Clean up buckets
        run: |
          # Clean up both SFW and NSFW videos from Storj (from /duplicate endpoint)
          uplink rm --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/$HURL_video_id.mp4" || true
          uplink rm --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/$HURL_video_id.mp4" || true

          # Clean up /duplicate endpoint thumbnails
          uplink rm --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/${HURL_video_id}_thumbnail.png" || true
          uplink rm --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/${HURL_video_id}_thumbnail.png" || true

          # Clean up multipart uploaded videos
          uplink rm --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/${HURL_video_id}_raw_mp.mp4" || true
          uplink rm --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/${HURL_video_id}_raw_mp_nsfw.mp4" || true

          # Clean up multipart upload thumbnails
          uplink rm --access="$ACCESS_SFW" "sj://yral-sfw/$HURL_publisher/${HURL_video_id}_raw_mp_thumbnail.png" || true
          uplink rm --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/$HURL_publisher/${HURL_video_id}_raw_mp_nsfw_thumbnail.png" || true

      # HLS Tests
      - name: Clean up any existing HLS test files
        run: |
          # Clean up both SFW and NSFW HLS files from Storj
          uplink rm --recursive --access="$ACCESS_SFW" "sj://yral-sfw/${HURL_hls_video_id}/hls/" || true
          uplink rm --recursive --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/${HURL_hls_video_id}_nsfw/hls/" || true

      - name: Run HLS duplication tests
        run: |
          # Create HLS vars file with video_id overridden to hls_video_id
          sed "s/^video_id=.*/video_id=$HURL_hls_video_id/" /tmp/hurl.vars > /tmp/hurl_hls.vars
          # Add retry and longer timeout for streaming uploads
          hurl --test --retry 3 --retry-interval 2000 --connect-timeout 30 --variables-file /tmp/hurl_hls.vars test/duplicate_hls.hurl
          hurl --test --variables-file /tmp/hurl_hls.vars test/confirm_duplicate_hls.hurl

      - name: Verify all HLS files were uploaded
        run: |
          # Wait for uploads to complete
          sleep 5
          
          # Check both SFW and NSFW buckets in Storj
          echo "Files in SFW bucket:"
          uplink ls --recursive --access="$ACCESS_SFW" "sj://yral-sfw/${HURL_hls_video_id}/hls/"
          
          echo "Files in NSFW bucket:"
          uplink ls --recursive --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/${HURL_hls_video_id}_nsfw/hls/"

      - name: Clean up HLS test files
        if: always()
        run: |
          # Clean up both SFW and NSFW HLS files from Storj
          uplink rm --recursive --access="$ACCESS_SFW" "sj://yral-sfw/${HURL_hls_video_id}/hls/" || true
          # Clean up NSFW bucket
          uplink rm --recursive --access="$ACCESS_NSFW" "sj://yral-nsfw-videos/${HURL_hls_video_id}_nsfw/hls/" || true
      
      - name: Clean up S3 test files
        if: always()
        env:
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
        run: |
          # Use the cleanup script
          chmod +x scripts/cleanup-s3-test-ci.sh
          ./scripts/cleanup-s3-test-ci.sh
