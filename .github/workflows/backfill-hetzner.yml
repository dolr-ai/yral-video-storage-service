name: Backfill Thumbnails — Hetzner

# Generates <video_id>-thumbnail.png for historical videos in a Hetzner S3 bucket.
# Bucket is resolved from the optional input, falling back to HETZNER_S3_BUCKET secret.
# Execute requires Production environment approval. All other commands are read-only.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Hetzner S3 bucket name (optional — defaults to HETZNER_S3_BUCKET secret)"
        required: false
        type: string
        default: ""
      command:
        description: "Command to run"
        required: true
        type: choice
        options:
          - audit
          - dry-run
          - verify
          - execute
      cutoff_before:
        description: "Cutoff timestamp, e.g. 2026-04-24T00:00:00Z"
        required: true
        type: string
      prefix:
        description: "Object prefix filter, e.g. publisher-id/  (optional)"
        required: false
        type: string
        default: ""
      verify_sample:
        description: "Thumbnails to sample for verify  (default 50)"
        required: false
        type: string
        default: "50"

concurrency:
  group: backfill-hetzner-${{ inputs.bucket || 'default' }}-${{ inputs.command }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: "test · backfill-thumbnails"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p backfill-thumbnails

  readonly:
    name: "${{ inputs.command }} · hetzner"
    needs: [test]
    if: ${{ inputs.command != 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Build (release)
        run: cargo build --release -p backfill-thumbnails

      - name: Run ${{ inputs.command }}
        env:
          HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_BUCKET: ${{ inputs.bucket || secrets.HETZNER_S3_BUCKET }}
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
          RUST_LOG: warn
        run: |
          set -euo pipefail

          ARGS=(
            --scope hetzner
            --cutoff-before "${{ inputs.cutoff_before }}"
            --manifest-dir artifacts/backfill
          )
          [[ -n "${{ inputs.prefix }}" ]] && ARGS+=(--prefix "${{ inputs.prefix }}")

          case "${{ inputs.command }}" in
            audit)    ./target/release/backfill-thumbnails audit "${ARGS[@]}" ;;
            dry-run)  ./target/release/backfill-thumbnails run   "${ARGS[@]}" ;;
            verify)   ./target/release/backfill-thumbnails verify \
                        --verify-sample "${{ inputs.verify_sample }}" "${ARGS[@]}" ;;
          esac 2>&1 | tee /tmp/bf-output.txt

      - name: Write job summary
        if: always()
        run: |
          RESOLVED_BUCKET="${{ inputs.bucket || '(from secret)' }}"
          {
            echo "## Backfill Hetzner — ${{ inputs.command }}"
            echo ""
            echo "### Inputs"
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| Bucket | \`${RESOLVED_BUCKET}\` |"
            echo "| Source | ${{ inputs.bucket && 'workflow input' || 'HETZNER_S3_BUCKET secret' }} |"
            echo "| Command | \`${{ inputs.command }}\` |"
            echo "| Cutoff | \`${{ inputs.cutoff_before }}\` |"
            echo "| Prefix | \`${{ inputs.prefix || '(none)' }}\` |"
            echo "| Verify Sample | \`${{ inputs.verify_sample }}\` |"
            echo ""
            if [[ -s /tmp/bf-output.txt ]]; then
              echo "### Results"
              echo "| Metric | Value |"
              echo "|--------|-------|"
              while IFS= read -r line; do
                if [[ "$line" =~ ^[A-Z] && "$line" == *": "* ]]; then
                  key="${line%%: *}"
                  value="${line#*: }"
                  echo "| ${key} | \`${value}\` |"
                fi
              done < /tmp/bf-output.txt
              echo ""
            fi
            echo "<details><summary>Full output</summary>"
            echo ""
            echo '```'
            cat /tmp/bf-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-hetzner-${{ inputs.command }}-${{ github.run_id }}
          path: artifacts/backfill/
          retention-days: 90
          if-no-files-found: ignore

  execute:
    name: "execute · hetzner"
    needs: [test]
    if: ${{ inputs.command == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 300
    environment: Production

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Build (release)
        run: cargo build --release -p backfill-thumbnails

      - name: Execute backfill run
        env:
          HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_BUCKET: ${{ inputs.bucket || secrets.HETZNER_S3_BUCKET }}
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
          RUST_LOG: warn
        run: |
          set -euo pipefail

          ARGS=(
            --scope hetzner
            --cutoff-before "${{ inputs.cutoff_before }}"
            --manifest-dir artifacts/backfill
            --execute
          )
          [[ -n "${{ inputs.prefix }}" ]] && ARGS+=(--prefix "${{ inputs.prefix }}")

          ./target/release/backfill-thumbnails run "${ARGS[@]}" 2>&1 | tee /tmp/bf-output.txt

      - name: Write job summary
        if: always()
        run: |
          RESOLVED_BUCKET="${{ inputs.bucket || '(from secret)' }}"
          {
            echo "## Backfill Hetzner — Execute"
            echo ""
            echo "### Inputs"
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| Bucket | \`${RESOLVED_BUCKET}\` |"
            echo "| Source | ${{ inputs.bucket && 'workflow input' || 'HETZNER_S3_BUCKET secret' }} |"
            echo "| Cutoff | \`${{ inputs.cutoff_before }}\` |"
            echo "| Prefix | \`${{ inputs.prefix || '(none)' }}\` |"
            echo ""
            if [[ -s /tmp/bf-output.txt ]]; then
              echo "### Results"
              echo "| Metric | Value |"
              echo "|--------|-------|"
              while IFS= read -r line; do
                if [[ "$line" =~ ^[A-Z] && "$line" == *": "* ]]; then
                  key="${line%%: *}"
                  value="${line#*: }"
                  echo "| ${key} | \`${value}\` |"
                fi
              done < /tmp/bf-output.txt
              echo ""
            fi
            echo "<details><summary>Full output</summary>"
            echo ""
            echo '```'
            cat /tmp/bf-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-hetzner-execute-${{ github.run_id }}
          path: artifacts/backfill/
          retention-days: 90
          if-no-files-found: ignore
