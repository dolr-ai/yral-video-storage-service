name: Backfill Thumbnails — Hetzner

# Generates <video_id>-thumbnail.png for historical videos in a Hetzner S3 bucket.
# Bucket is resolved from the optional input, falling back to HETZNER_S3_BUCKET secret.
# Execute requires Production environment approval. All other commands are read-only.
#
# Sharding: set shard_count > 1 to spawn that many parallel execute runners, each
# processing a distinct slice of videos. One trigger → all shards start automatically.
# Failed shards can be individually re-run via "Re-run failed jobs" in the GH Actions UI.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: "Hetzner S3 bucket name (optional — defaults to HETZNER_S3_BUCKET secret)"
        required: false
        type: string
        default: ""
      command:
        description: "Command to run"
        required: true
        type: choice
        options:
          - audit
          - dry-run
          - verify
          - execute
      cutoff_before:
        description: "Cutoff timestamp, e.g. 2026-04-24T00:00:00Z"
        required: true
        type: string
      prefix:
        description: "Object prefix filter, e.g. publisher-id/  (optional)"
        required: false
        type: string
        default: ""
      verify_sample:
        description: "Thumbnails to sample for verify  (default 50)"
        required: false
        type: string
        default: "50"
      ffmpeg_concurrency:
        description: "Parallel ffmpeg workers per shard (default 2, max ~4 on ubuntu-latest)"
        required: false
        type: string
        default: "2"
      shard_count:
        description: "Parallel execute shards (1 = all videos on one runner, 3 = split across 3 runners)"
        required: false
        type: string
        default: "1"

concurrency:
  group: backfill-hetzner-${{ inputs.bucket || 'default' }}-${{ inputs.command }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: "test · backfill-thumbnails"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test -p backfill-thumbnails

  readonly:
    name: "${{ inputs.command }} · hetzner"
    needs: [test]
    if: ${{ inputs.command != 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Build (release)
        run: cargo build --release -p backfill-thumbnails

      - name: Run ${{ inputs.command }}
        env:
          HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_BUCKET: ${{ inputs.bucket || secrets.HETZNER_S3_BUCKET }}
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
          RUST_LOG: warn
        run: |
          set -euo pipefail

          ARGS=(
            --scope hetzner
            --cutoff-before "${{ inputs.cutoff_before }}"
            --manifest-dir artifacts/backfill
          )
          [[ -n "${{ inputs.prefix }}" ]] && ARGS+=(--prefix "${{ inputs.prefix }}")

          case "${{ inputs.command }}" in
            audit)    ./target/release/backfill-thumbnails audit "${ARGS[@]}" ;;
            dry-run)  ./target/release/backfill-thumbnails run   "${ARGS[@]}" \
                        --ffmpeg-concurrency "${{ inputs.ffmpeg_concurrency }}" ;;
            verify)   ./target/release/backfill-thumbnails verify \
                        --verify-sample "${{ inputs.verify_sample }}" "${ARGS[@]}" ;;
          esac 2>&1 | tee /tmp/bf-output.txt

      - name: Write job summary
        if: always()
        run: |
          RESOLVED_BUCKET="${{ inputs.bucket || '(from secret)' }}"
          {
            echo "## Backfill Hetzner — ${{ inputs.command }}"
            echo ""
            echo "### Inputs"
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| Bucket | \`${RESOLVED_BUCKET}\` |"
            echo "| Source | ${{ inputs.bucket && 'workflow input' || 'HETZNER_S3_BUCKET secret' }} |"
            echo "| Command | \`${{ inputs.command }}\` |"
            echo "| Cutoff | \`${{ inputs.cutoff_before }}\` |"
            echo "| Prefix | \`${{ inputs.prefix || '(none)' }}\` |"
            echo "| Verify Sample | \`${{ inputs.verify_sample }}\` |"
            echo "| FFmpeg Concurrency | \`${{ inputs.ffmpeg_concurrency }}\` |"
            echo ""
            if [[ -s /tmp/bf-output.txt ]]; then
              echo "### Results"
              echo "| Metric | Value |"
              echo "|--------|-------|"
              while IFS= read -r line; do
                if [[ "$line" =~ ^[A-Z] && "$line" == *": "* ]]; then
                  key="${line%%: *}"
                  value="${line#*: }"
                  echo "| ${key} | \`${value}\` |"
                fi
              done < /tmp/bf-output.txt
              echo ""
            fi
            echo "<details><summary>Full output</summary>"
            echo ""
            echo '```'
            cat /tmp/bf-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-hetzner-${{ inputs.command }}-${{ github.run_id }}
          path: artifacts/backfill/
          retention-days: 90
          if-no-files-found: ignore

  # Converts the shard_count input into a JSON array [0, 1, ..., N-1] for the matrix.
  generate-shard-matrix:
    name: "generate shard matrix"
    needs: [test]
    if: ${{ inputs.command == 'execute' }}
    runs-on: ubuntu-latest
    outputs:
      shard_indices: ${{ steps.matrix.outputs.shard_indices }}
    steps:
      - id: matrix
        run: |
          COUNT="${{ inputs.shard_count || '1' }}"
          INDICES="["
          for i in $(seq 0 $((COUNT - 1))); do
            [ "$i" -gt 0 ] && INDICES+=","
            INDICES+="$i"
          done
          INDICES+="]"
          echo "shard_indices=${INDICES}" >> "$GITHUB_OUTPUT"

  execute:
    name: "execute · hetzner · shard ${{ matrix.shard_index }}/${{ inputs.shard_count }}"
    needs: [generate-shard-matrix]
    if: ${{ inputs.command == 'execute' }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    environment: Production

    # Each shard gets its own concurrency slot so all shards run in parallel.
    # cancel-in-progress: false ensures retriggered runs queue rather than cancel in-flight work.
    concurrency:
      group: backfill-hetzner-${{ inputs.bucket || 'default' }}-execute-shard${{ matrix.shard_index }}
      cancel-in-progress: false

    strategy:
      fail-fast: false   # a failed shard does not cancel other shards
      matrix:
        shard_index: ${{ fromJson(needs.generate-shard-matrix.outputs.shard_indices) }}

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable

      - uses: Swatinem/rust-cache@v2

      - name: Install ffmpeg
        run: sudo apt-get install -y ffmpeg

      - name: Build (release)
        run: cargo build --release -p backfill-thumbnails

      - name: Execute backfill run
        env:
          HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_BUCKET: ${{ inputs.bucket || secrets.HETZNER_S3_BUCKET }}
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
          RUST_LOG: warn
        run: |
          set -euo pipefail

          ARGS=(
            --scope hetzner
            --cutoff-before "${{ inputs.cutoff_before }}"
            --manifest-dir artifacts/backfill
            --execute
            --ffmpeg-concurrency "${{ inputs.ffmpeg_concurrency }}"
            --shard-index "${{ matrix.shard_index }}"
            --shard-count "${{ inputs.shard_count }}"
          )
          [[ -n "${{ inputs.prefix }}" ]] && ARGS+=(--prefix "${{ inputs.prefix }}")

          ./target/release/backfill-thumbnails run "${ARGS[@]}" 2>&1 | tee /tmp/bf-output.txt

      - name: Write job summary
        if: always()
        run: |
          RESOLVED_BUCKET="${{ inputs.bucket || '(from secret)' }}"
          {
            echo "## Backfill Hetzner — Execute · Shard ${{ matrix.shard_index }}/${{ inputs.shard_count }}"
            echo ""
            echo "### Inputs"
            echo "| Input | Value |"
            echo "|-------|-------|"
            echo "| Bucket | \`${RESOLVED_BUCKET}\` |"
            echo "| Source | ${{ inputs.bucket && 'workflow input' || 'HETZNER_S3_BUCKET secret' }} |"
            echo "| Cutoff | \`${{ inputs.cutoff_before }}\` |"
            echo "| Prefix | \`${{ inputs.prefix || '(none)' }}\` |"
            echo "| FFmpeg Concurrency | \`${{ inputs.ffmpeg_concurrency }}\` |"
            echo "| Shard | \`${{ matrix.shard_index }} / ${{ inputs.shard_count }}\` |"
            echo ""
            if [[ -s /tmp/bf-output.txt ]]; then
              echo "### Results"
              echo "| Metric | Value |"
              echo "|--------|-------|"
              while IFS= read -r line; do
                if [[ "$line" =~ ^[A-Z] && "$line" == *": "* ]]; then
                  key="${line%%: *}"
                  value="${line#*: }"
                  echo "| ${key} | \`${value}\` |"
                fi
              done < /tmp/bf-output.txt
              echo ""
            fi
            echo "<details><summary>Full output</summary>"
            echo ""
            echo '```'
            cat /tmp/bf-output.txt 2>/dev/null || echo "(no output captured)"
            echo '```'
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backfill-hetzner-execute-${{ github.run_id }}-shard${{ matrix.shard_index }}
          path: artifacts/backfill/
          retention-days: 90
          if-no-files-found: ignore
