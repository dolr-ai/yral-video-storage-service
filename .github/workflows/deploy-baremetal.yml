name: Deploy to Bare Metal Servers

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: deploy-baremetal-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVER_1_IP: 94.130.13.115
  APP_DIR: /home/deploy/storj-interface
  HOST_PORT: 3004

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image_tag: ${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: Deployment
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STORJ_ACCESS_GRANT: ${{ secrets.STORJ_ACCESS_GRANT }}
      HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
      HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
      HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
      SERVICE_SECRET_TOKEN: ${{ secrets.SERVICE_SECRET_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      STORJ_GATEWAY_ACCESS_KEY: ${{ secrets.STORJ_GATEWAY_ACCESS_KEY }}
      STORJ_GATEWAY_SECRET_KEY: ${{ secrets.STORJ_GATEWAY_SECRET_KEY }}
      STORJ_MIRROR_ACCESS_GRANT: ${{ secrets.STORJ_MIRROR_ACCESS_GRANT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSHit p
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PRAKASH }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.SERVER_1_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync deployment files to server
        run: |
          ssh "deploy@${{ env.SERVER_1_IP }}" "mkdir -p ${{ env.APP_DIR }}"
          scp deploy/docker-compose.yml "deploy@${{ env.SERVER_1_IP }}:${{ env.APP_DIR }}/"

      - name: Deploy with Docker Compose
        run: |
          ssh "deploy@${{ env.SERVER_1_IP }}" \
            "export APP_IMAGE='ghcr.io/${{ github.repository }}'; \
             export IMAGE_TAG='${{ github.sha }}'; \
             export HOST_PORT='${{ env.HOST_PORT }}'; \
             export STORJ_ACCESS_GRANT_SFW='${STORJ_ACCESS_GRANT}'; \
             export STORJ_ACCESS_GRANT_NSFW='${STORJ_ACCESS_GRANT}'; \
             export SFW_BUCKET='yral-videos'; \
             export NSFW_BUCKET='yral-nsfw-videos'; \
             export HETZNER_S3_ENDPOINT='${HETZNER_S3_ENDPOINT}'; \
             export HETZNER_S3_BUCKET='${HETZNER_S3_BUCKET}'; \
             export HETZNER_S3_ACCESS_KEY='${HETZNER_S3_ACCESS_KEY}'; \
             export HETZNER_S3_SECRET_KEY='${HETZNER_S3_SECRET_KEY}'; \
             export HETZNER_S3_REGION='${HETZNER_S3_REGION}'; \
             export SERVICE_SECRET_TOKEN='${SERVICE_SECRET_TOKEN}'; \
             export POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'; \
             export STORJ_GATEWAY_ACCESS_KEY='${STORJ_GATEWAY_ACCESS_KEY}'; \
             export STORJ_GATEWAY_SECRET_KEY='${STORJ_GATEWAY_SECRET_KEY}'; \
             export STORJ_MIRROR_ACCESS_GRANT='${STORJ_MIRROR_ACCESS_GRANT}'; \
             export ENVIRONMENT='production'; \
             cd ${{ env.APP_DIR }} && \
             echo '${GITHUB_TOKEN}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             docker compose pull && \
             docker compose up -d --remove-orphans"

      - name: Verify deployment
        run: |
          ssh "deploy@${{ env.SERVER_1_IP }}" "
            cd ${{ env.APP_DIR }}
            echo '=== Container Status ==='
            docker compose ps
            echo '=== Logs (last 20 lines) ==='
            docker compose logs --tail=20 storj-interface 2>/dev/null || true
          "

      - name: Run health check
        run: |
          sleep 10
          curl --fail --retry 5 --retry-delay 5 https://storj-interface.yral.com/health

  deployment-summary:
    name: Deployment Summary
    needs: [deploy]
    runs-on: ubuntu-latest
    permissions: {}
    if: always()

    steps:
      - name: Deployment summary
        run: |
          echo "## Bare Metal Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status: ${{ needs.deploy.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Image" >> $GITHUB_STEP_SUMMARY
          echo "- ghcr.io/${{ github.repository }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Services" >> $GITHUB_STEP_SUMMARY
          echo "- storj-interface (HTTP on host port ${{ env.HOST_PORT }}, proxied by infra Caddy)" >> $GITHUB_STEP_SUMMARY
          echo "- postgres (video_fingerprint_index DB, internal only)" >> $GITHUB_STEP_SUMMARY
