name: Verify Hetzner Object Exists

# Read-only diagnostic workflow for checking whether a specific object exists in
# the Hetzner SFW bucket. The push trigger is scoped to this investigation branch
# so the workflow appears and runs before it is merged to the default branch.

on:
  push:
    branches:
      - prakash/verify-hetzner-object
  workflow_dispatch:
    inputs:
      key:
        description: "Hetzner object key to verify"
        required: true
        type: string
        default: "q6mn5-bcoym-ajuor-qyeqi-34qql-7kthq-fqhyo-tly2e-eyb7o-skbbq-xae/55deccae224e4f55b0c84ee0f17430e1.mp4"
      bucket:
        description: "Hetzner bucket"
        required: true
        type: string
        default: "yral-sfw"

concurrency:
  group: verify-hetzner-object-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: "verify · hetzner object"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.HETZNER_S3_REGION }}
      HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
      BUCKET: ${{ inputs.bucket || 'yral-sfw' }}
      KEY: ${{ inputs.key || 'q6mn5-bcoym-ajuor-qyeqi-34qql-7kthq-fqhyo-tly2e-eyb7o-skbbq-xae/55deccae224e4f55b0c84ee0f17430e1.mp4' }}
    steps:
      - name: Verify object exists
        run: |
          set -euo pipefail

          echo "Bucket: $BUCKET"
          echo "Key:    $KEY"
          echo ""

          if aws s3api head-object \
            --bucket "$BUCKET" \
            --key "$KEY" \
            --endpoint-url "$HETZNER_S3_ENDPOINT" \
            --output json > /tmp/head.json 2> /tmp/head.err; then
            echo "EXISTS: $KEY"
            cat /tmp/head.json
            {
              echo "## Hetzner object check"
              echo ""
              echo "| Field | Value |"
              echo "|-------|-------|"
              echo "| Bucket | \`$BUCKET\` |"
              echo "| Key | \`$KEY\` |"
              echo "| Result | EXISTS |"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          echo "NOT VERIFIED: $KEY"
          cat /tmp/head.err

          if grep -Eq "Not Found|404|NoSuchKey|NotFound" /tmp/head.err; then
            echo "MISSING: $KEY"
            result="MISSING"
            exit_code=1
          else
            echo "FAILED: unable to determine existence"
            result="FAILED"
            exit_code=2
          fi

          {
            echo "## Hetzner object check"
            echo ""
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Bucket | \`$BUCKET\` |"
            echo "| Key | \`$KEY\` |"
            echo "| Result | $result |"
            echo ""
            echo "### AWS error"
            echo ""
            echo '```'
            cat /tmp/head.err
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$exit_code"
