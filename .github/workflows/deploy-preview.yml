name: deploy preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  id-token: write
  pull-requests: write
  contents: read
  packages: write
  deployments: write

jobs:
  build-and-push:
    if: ${{ github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ffmpeg dev libraries
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libswresample-dev \
            clang pkg-config

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:cache-pr-${{ github.event.number }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:cache-pr-${{ github.event.number }},mode=max

  preview:
    if: ${{ github.event.pull_request.state == 'open' }}
    needs: build-and-push
    runs-on: ubuntu-latest

    outputs:
      url: ${{ steps.meta.outputs.preview_url }}

    concurrency:
      group: pr-${{ github.event.number }}-${{ github.event.repository.name }}
      cancel-in-progress: true

    environment:
      name: Deployment
      url: ${{ steps.meta.outputs.preview_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute Preview Metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.number }}
          OWNER_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          IMAGE="ghcr.io/${OWNER_NAME}/${REPO_NAME}"
          IMAGE_TAG="pr-${PR_NUMBER}"
          PREVIEW_DOMAIN="pr-${PR_NUMBER}-${REPO_NAME}.preview.yral.com"
          PREVIEW_URL="https://${PREVIEW_DOMAIN}"
          SERVICE_NAME="pr-${PR_NUMBER}-${REPO_NAME}"

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "preview_domain=${PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Import Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: yral-video-storage-service-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/yral-video-storage-service/COOLIFY_TOKEN value | COOLIFY_TOKEN ;
            secret/data/yral-video-storage-service/COOLIFY_PROJECT_UUID value | COOLIFY_PROJECT_UUID ;
            secret/data/yral-video-storage-service/COOLIFY_SERVER_UUID value | COOLIFY_SERVER_UUID ;
            secret/data/yral-video-storage-service/COOLIFY_ENV_UUID value | COOLIFY_ENV_UUID ;
            secret/data/yral-video-storage-service/BACKEND_ADMIN_IDENTITY value | BACKEND_ADMIN_IDENTITY ;
            secret/data/yral-video-storage-service/INTERNAL_ENCRYPTION_SECRET value | INTERNAL_ENCRYPTION_SECRET ;
            secret/data/yral-video-storage-service/MODERATION_HMAC_SECRET value | MODERATION_HMAC_SECRET ;

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PRAKASH }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H 138.201.129.173 94.130.13.115 88.99.151.102 >> ~/.ssh/known_hosts 2>/dev/null

      - name: Provision Preview Postgres
        env:
          PREVIEW_DB_PASSWORD: ${{ secrets.PREVIEW_DB_PASSWORD }}
        run: |
          COOLIFY_SERVER_RESPONSE=$(curl -s "https://coolify.yral.com/api/v1/servers/${COOLIFY_SERVER_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")
          echo "Coolify server response: ${COOLIFY_SERVER_RESPONSE:0:300}"
          COOLIFY_IP=$(echo "$COOLIFY_SERVER_RESPONSE" | jq -r '.ip // empty')
          if [ -z "$COOLIFY_IP" ]; then
            echo "ERROR: could not determine Coolify server IP — iptables rule will not be added"
            exit 1
          fi
          # Resolve hostname to IP if the API returned a hostname instead of an IP
          if ! echo "$COOLIFY_IP" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Coolify API returned hostname '${COOLIFY_IP}', resolving to IP..."
            COOLIFY_IP=$(getent hosts "$COOLIFY_IP" | awk '{print $1}' | head -n1)
            if [ -z "$COOLIFY_IP" ]; then
              echo "ERROR: could not resolve hostname to IP"
              exit 1
            fi
          fi
          echo "Coolify server IP: ${COOLIFY_IP}"

          REMOTE_SCRIPT="
            if docker ps -a -q -f name=yral-video-preview-db | grep -q .; then
              NETMODE=\$(docker inspect --format '{{.HostConfig.NetworkMode}}' yral-video-preview-db 2>/dev/null)
              if [ \"\$NETMODE\" != 'host' ]; then
                echo 'Recreating Postgres with host network mode'
                docker rm -f yral-video-preview-db
              fi
            fi
            if ! docker ps -q -f name=yral-video-preview-db | grep -q .; then
              docker run -d --name yral-video-preview-db --restart unless-stopped \
                --network host \
                -e POSTGRES_USER=storj \
                -e POSTGRES_PASSWORD='${PREVIEW_DB_PASSWORD}' \
                -e POSTGRES_DB=video_fingerprint_index \
                -e PGPORT=5433 \
                postgres:16-alpine
            fi
            if [ -n '${COOLIFY_IP}' ]; then
              docker run --rm --privileged --network=host alpine sh -c \
                'apk add --no-cache iptables -q && iptables -C INPUT -p tcp -s ${COOLIFY_IP} --dport 5433 -j ACCEPT 2>/dev/null || iptables -I INPUT -p tcp -s ${COOLIFY_IP} --dport 5433 -j ACCEPT'
            fi
          "
          echo "$REMOTE_SCRIPT" | ssh deploy@138.201.129.173 bash

      - name: Open RabbitMQ firewall for Coolify server
        run: |
          COOLIFY_IP=$(curl -s "https://coolify.yral.com/api/v1/servers/${COOLIFY_SERVER_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" | jq -r '.ip // empty')
          if [ -z "$COOLIFY_IP" ]; then
            echo "ERROR: could not determine Coolify server IP"
            exit 1
          fi
          # Resolve hostname to IP if the API returned a hostname instead of an IP
          if ! echo "$COOLIFY_IP" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "Coolify API returned hostname '${COOLIFY_IP}', resolving to IP..."
            COOLIFY_IP=$(getent hosts "$COOLIFY_IP" | awk '{print $1}' | head -n1)
            if [ -z "$COOLIFY_IP" ]; then
              echo "ERROR: could not resolve hostname to IP"
              exit 1
            fi
          fi
          echo "Opening RabbitMQ port 5671 for Coolify IP: ${COOLIFY_IP}"
          for NODE in 94.130.13.115 88.99.151.102 138.201.129.173; do
            ssh deploy@${NODE} "
              sudo iptables -N RABBITMQ-FILTER 2>/dev/null || true
              sudo iptables -C INPUT -p tcp --dport 5671 -j RABBITMQ-FILTER 2>/dev/null \
                || sudo iptables -I INPUT 1 -p tcp --dport 5671 -j RABBITMQ-FILTER
              sudo iptables -C RABBITMQ-FILTER -p tcp --dport 5671 -s ${COOLIFY_IP} -j ACCEPT 2>/dev/null \
                || sudo iptables -I RABBITMQ-FILTER 1 -p tcp --dport 5671 -s ${COOLIFY_IP} -j ACCEPT
              echo 'rule ok on ${NODE}'
            "
          done

      - name: Create Coolify Application
        id: coolify_app
        run: |
          APP_NAME="${{ steps.meta.outputs.service_name }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          PREVIEW_DOMAIN="${{ steps.meta.outputs.preview_domain }}"

          EXISTING=$(curl -s \
            "https://coolify.yral.com/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r --arg name "$APP_NAME" '.[] | select(.name == $name) | .uuid // empty')

          if [ -n "$EXISTING" ]; then
            echo "Reusing existing application ${EXISTING}, updating image tag..."
            APP_UUID="$EXISTING"
            curl -s -X PATCH \
              "https://coolify.yral.com/api/v1/applications/${APP_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{\"docker_registry_image_tag\": \"${IMAGE_TAG}\"}" > /dev/null
          else
            RESPONSE=$(curl -s -X POST \
              "https://coolify.yral.com/api/v1/applications/dockerimage" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg name "$APP_NAME" \
                --arg project_uuid "$COOLIFY_PROJECT_UUID" \
                --arg server_uuid "$COOLIFY_SERVER_UUID" \
                --arg env_uuid "$COOLIFY_ENV_UUID" \
                --arg image "$IMAGE" \
                --arg image_tag "$IMAGE_TAG" \
                --arg domains "https://${PREVIEW_DOMAIN}" \
                '{
                  "name": $name,
                  "project_uuid": $project_uuid,
                  "server_uuid": $server_uuid,
                  "environment_name": "preview",
                  "environment_uuid": $env_uuid,
                  "docker_registry_image_name": $image,
                  "docker_registry_image_tag": $image_tag,
                  "domains": $domains,
                  "ports_exposes": "3000",
                  "is_static": false
                }')")

            echo "Create response: ${RESPONSE:0:500}"
            APP_UUID=$(echo "$RESPONSE" | jq -r '.uuid // empty')

            if [ -z "$APP_UUID" ]; then
              echo "Failed to create Coolify application"
              echo "$RESPONSE"
              exit 1
            fi
          fi

          echo "app_uuid=${APP_UUID}" >> "$GITHUB_OUTPUT"

      - name: Validate Required Secrets
        env:
          VIDEOGEN_SERVICE_AUTH_TOKEN: ${{ secrets.VIDEOGEN_SERVICE_AUTH_TOKEN }}
        run: |
          if [ -z "$VIDEOGEN_SERVICE_AUTH_TOKEN" ]; then
            echo "ERROR: VIDEOGEN_SERVICE_AUTH_TOKEN secret is not set in GitHub repo secrets."
            echo "Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Push Environment Variables
        env:
          STORJ_ACCESS_GRANT_SFW: ${{ secrets.STORJ_ACCESS_GRANT }}
          STORJ_ACCESS_GRANT_NSFW: ${{ secrets.STORJ_ACCESS_GRANT_NSFW }}
          SFW_BUCKET: yral-sfw
          NSFW_BUCKET: yral-nsfw-videos
          SERVICE_SECRET_TOKEN: ${{ secrets.SERVICE_SECRET_TOKEN }}
          HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
          HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
          STORJ_EU1_GATEWAY_ACCESS_KEY: ${{ secrets.STORJ_EU1_GATEWAY_ACCESS_KEY }}
          STORJ_EU1_GATEWAY_SECRET_KEY: ${{ secrets.STORJ_EU1_GATEWAY_SECRET_KEY }}
          STORJ_MIRROR_ACCESS_GRANT: ${{ secrets.STORJ_MIRROR_ACCESS_GRANT }}
          SFW_SHARE_EU1_URL: ${{ secrets.SFW_SHARE_EU1_URL }}
          ENVIRONMENT: staging
          VIDEOGEN_RABBITMQ_PUBLISHER_PASSWORD: ${{ secrets.VIDEOGEN_RABBITMQ_PUBLISHER_PASSWORD }}
          VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64: ${{ secrets.VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64 }}
          VIDEOGEN_SERVICE_AUTH_TOKEN: ${{ secrets.VIDEOGEN_SERVICE_AUTH_TOKEN }}
          BACKEND_ADMIN_IDENTITY: ${{ env.BACKEND_ADMIN_IDENTITY }}
          INTERNAL_ENCRYPTION_SECRET: ${{ env.INTERNAL_ENCRYPTION_SECRET }}
          MODERATION_HMAC_SECRET: ${{ env.MODERATION_HMAC_SECRET }}
        run: |
          APP_UUID="${{ steps.coolify_app.outputs.app_uuid }}"
          PREVIEW_URL="${{ steps.meta.outputs.preview_url }}"

          ENV_JSON=$(jq -n \
            --arg database_url "postgres://storj:${{ secrets.PREVIEW_DB_PASSWORD }}@138.201.129.173:5433/video_fingerprint_index" \
            --arg storj_access_grant_sfw "$STORJ_ACCESS_GRANT_SFW" \
            --arg storj_access_grant_nsfw "$STORJ_ACCESS_GRANT_NSFW" \
            --arg sfw_bucket "$SFW_BUCKET" \
            --arg nsfw_bucket "$NSFW_BUCKET" \
            --arg service_secret_token "$SERVICE_SECRET_TOKEN" \
            --arg hetzner_s3_endpoint "$HETZNER_S3_ENDPOINT" \
            --arg hetzner_s3_access_key "$HETZNER_S3_ACCESS_KEY" \
            --arg hetzner_s3_secret_key "$HETZNER_S3_SECRET_KEY" \
            --arg hetzner_s3_bucket "$HETZNER_S3_BUCKET" \
            --arg hetzner_s3_region "$HETZNER_S3_REGION" \
            --arg storj_eu1_gateway_access_key "$STORJ_EU1_GATEWAY_ACCESS_KEY" \
            --arg storj_eu1_gateway_secret_key "$STORJ_EU1_GATEWAY_SECRET_KEY" \
            --arg storj_mirror_access_grant "$STORJ_MIRROR_ACCESS_GRANT" \
            --arg sfw_share_eu1_url "$SFW_SHARE_EU1_URL" \
            --arg environment "$ENVIRONMENT" \
            --arg prakash_public_base_url "$PREVIEW_URL" \
            --arg videogen_rabbitmq_publisher_password "$VIDEOGEN_RABBITMQ_PUBLISHER_PASSWORD" \
            --arg videogen_rabbitmq_tls_ca_cert_pem_b64 "$VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64" \
            --arg videogen_service_auth_token "$VIDEOGEN_SERVICE_AUTH_TOKEN" \
            --arg backend_admin_identity "$BACKEND_ADMIN_IDENTITY" \
            --arg internal_encryption_secret "$INTERNAL_ENCRYPTION_SECRET" \
            --arg moderation_hmac_secret "$MODERATION_HMAC_SECRET" \
            '{
              "data": [
                {"key": "DATABASE_URL", "value": $database_url, "is_literal": true},
                {"key": "STORJ_ACCESS_GRANT_SFW", "value": $storj_access_grant_sfw, "is_literal": true},
                {"key": "STORJ_ACCESS_GRANT_NSFW", "value": $storj_access_grant_nsfw, "is_literal": true},
                {"key": "SFW_BUCKET", "value": $sfw_bucket, "is_literal": true},
                {"key": "NSFW_BUCKET", "value": $nsfw_bucket, "is_literal": true},
                {"key": "SERVICE_SECRET_TOKEN", "value": $service_secret_token, "is_literal": true},
                {"key": "HETZNER_S3_ENDPOINT", "value": $hetzner_s3_endpoint, "is_literal": true},
                {"key": "HETZNER_S3_ACCESS_KEY", "value": $hetzner_s3_access_key, "is_literal": true},
                {"key": "HETZNER_S3_SECRET_KEY", "value": $hetzner_s3_secret_key, "is_literal": true},
                {"key": "HETZNER_S3_BUCKET", "value": $hetzner_s3_bucket, "is_literal": true},
                {"key": "HETZNER_S3_REGION", "value": $hetzner_s3_region, "is_literal": true},
                {"key": "STORJ_EU1_GATEWAY_ACCESS_KEY", "value": $storj_eu1_gateway_access_key, "is_literal": true},
                {"key": "STORJ_EU1_GATEWAY_SECRET_KEY", "value": $storj_eu1_gateway_secret_key, "is_literal": true},
                {"key": "STORJ_MIRROR_ACCESS_GRANT", "value": $storj_mirror_access_grant, "is_literal": true},
                {"key": "SFW_SHARE_EU1_URL", "value": $sfw_share_eu1_url, "is_literal": true},
                {"key": "ENVIRONMENT", "value": $environment, "is_literal": true},
                {"key": "PRAKASH_PUBLIC_BASE_URL", "value": $prakash_public_base_url, "is_literal": true},
                {"key": "VIDEOGEN_VAST_SUBMIT_TRANSPORT", "value": "rabbitmq", "is_literal": true},
                {"key": "VIDEOGEN_UPLOAD_SERVICE_URL", "value": "https://upload.yral.com", "is_literal": true},
                {"key": "MODERATION_MODE", "value": "remote", "is_literal": true},
                {"key": "VIDEOGEN_RABBITMQ_PUBLISHER_PASSWORD", "value": $videogen_rabbitmq_publisher_password, "is_literal": true},
                {"key": "VIDEOGEN_RABBITMQ_TLS_CA_CERT_PEM_B64", "value": $videogen_rabbitmq_tls_ca_cert_pem_b64, "is_literal": true},
                {"key": "VIDEOGEN_SERVICE_AUTH_TOKEN", "value": $videogen_service_auth_token, "is_literal": true},
                {"key": "BACKEND_ADMIN_IDENTITY", "value": $backend_admin_identity, "is_multiline": true},
                {"key": "INTERNAL_ENCRYPTION_SECRET", "value": $internal_encryption_secret, "is_literal": true},
                {"key": "MODERATION_HMAC_SECRET", "value": $moderation_hmac_secret, "is_literal": true}
              ]
            }')

          RESPONSE=$(curl -s -o /tmp/coolify-env-response.txt -w "%{http_code}" -X PATCH \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}/envs/bulk" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${ENV_JSON}")

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Failed to push environment variables (HTTP $RESPONSE)"
            cat /tmp/coolify-env-response.txt
            exit 1
          fi

      - name: Deploy
        id: deploy
        run: |
          APP_UUID="${{ steps.coolify_app.outputs.app_uuid }}"

          BODY=$(curl -s -X POST \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}/start" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"uuid\": \"${APP_UUID}\", \"force\": true}")

          echo "Deploy response: ${BODY:0:300}"
          DEPLOY_UUID=$(echo "$BODY" | jq -r '.deployment_uuid // empty')

          if [ -z "$DEPLOY_UUID" ]; then
            echo "Failed to get deployment UUID"
            echo "$BODY"
            exit 1
          fi

          echo "deploy_uuid=${DEPLOY_UUID}" >> "$GITHUB_OUTPUT"

      - name: Wait for Deployment
        run: |
          DEPLOY_UUID="${{ steps.deploy.outputs.deploy_uuid }}"
          MAX=60
          for i in $(seq 1 $MAX); do
            STATUS=$(curl -s \
              "https://coolify.yral.com/api/v1/deployments/${DEPLOY_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              | jq -r '.status // empty')
            echo "Attempt ${i}/${MAX}: status=${STATUS}"
            if [[ "$STATUS" == "finished" ]]; then
              echo "Deployment finished successfully"
              break
            fi
            if [[ "$STATUS" == "failed" || "$STATUS" == "error" ]]; then
              echo "Deployment failed with status: ${STATUS}"
              exit 1
            fi
            if [[ "$i" == "$MAX" ]]; then
              echo "Deployment timed out"
              exit 1
            fi
            sleep 10
          done

      - name: Route smoke check
        run: |
          PREVIEW_URL="${{ steps.meta.outputs.preview_url }}"
          MAX=30
          for i in $(seq 1 $MAX); do
            CODE=$(curl -s -o /tmp/smoke-body.txt -w "%{http_code}" --insecure \
              "${PREVIEW_URL}/api-docs/openapi.json")
            echo "Attempt ${i}/${MAX}: HTTP ${CODE}"
            if [[ "$CODE" == "200" ]]; then
              break
            fi
            if [[ "$i" == "$MAX" ]]; then
              echo "=== Smoke check failed — response headers ==="
              curl -sI --insecure "${PREVIEW_URL}/api-docs/openapi.json" || true
              echo "=== Response body ==="
              cat /tmp/smoke-body.txt
              exit 1
            fi
            sleep 10
          done


  destroy_preview:
    if: ${{ github.event.pull_request.state == 'closed' }}
    runs-on: ubuntu-latest

    steps:
      - name: Compute Preview Metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.number }}
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          SERVICE_NAME="pr-${PR_NUMBER}-${REPO_NAME}"

          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Import Coolify Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: yral-video-storage-service-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/yral-video-storage-service/COOLIFY_TOKEN value | COOLIFY_TOKEN ;

      - name: Find and Delete Coolify Application
        run: |
          APP_NAME="${{ steps.meta.outputs.service_name }}"

          APP_UUID=$(curl -s \
            "https://coolify.yral.com/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r --arg name "$APP_NAME" '.[] | select(.name == $name) | .uuid // empty')

          if [ -z "$APP_UUID" ]; then
            echo "No Coolify application found for ${APP_NAME}; skipping"
            exit 0
          fi

          RESPONSE=$(curl -s -o /tmp/coolify-delete-response.txt -w "%{http_code}" -X DELETE \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json")

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Failed to delete Coolify application ${APP_NAME} (HTTP $RESPONSE)"
            cat /tmp/coolify-delete-response.txt
            exit 1
          fi

  e2e-tests:
    if: ${{ github.event.pull_request.state == 'open' }}
    needs: preview
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit
    with:
      preview_url: ${{ needs.preview.outputs.url }}
      publisher: testuser-${{ github.sha }}
