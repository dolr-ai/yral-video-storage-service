name: deploy preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  id-token: write
  pull-requests: write
  contents: read
  packages: write
  deployments: write

jobs:
  build-and-push:
    if: ${{ github.event.pull_request.state == 'open' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ffmpeg dev libraries
        run: |
          sudo apt-get update && sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libswresample-dev \
            clang pkg-config

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:pr-${{ github.event.number }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository }}:cache-pr-${{ github.event.number }}
          cache-to: type=registry,ref=ghcr.io/${{ github.repository }}:cache-pr-${{ github.event.number }},mode=max

  preview:
    if: ${{ github.event.pull_request.state == 'open' }}
    needs: build-and-push
    runs-on: ubuntu-latest

    outputs:
      url: ${{ steps.meta.outputs.preview_url }}

    concurrency:
      group: pr-${{ github.event.number }}-${{ github.event.repository.name }}
      cancel-in-progress: true

    environment:
      name: Deployment
      url: ${{ steps.meta.outputs.preview_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute Preview Metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.number }}
          OWNER_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          IMAGE="ghcr.io/${OWNER_NAME}/${REPO_NAME}"
          IMAGE_TAG="pr-${PR_NUMBER}"
          PREVIEW_DOMAIN="pr-${PR_NUMBER}-${REPO_NAME}.preview.yral.com"
          PREVIEW_URL="https://${PREVIEW_DOMAIN}"
          SERVICE_NAME="pr-${PR_NUMBER}-${REPO_NAME}"

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "preview_domain=${PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Import Coolify Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: yral-video-storage-service-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/COOLIFY_TOKEN value | COOLIFY_TOKEN ;
            secret/data/COOLIFY_PROJECT_UUID value | COOLIFY_PROJECT_UUID ;
            secret/data/COOLIFY_SERVER_UUID value | COOLIFY_SERVER_UUID ;
            secret/data/COOLIFY_ENV_UUID value | COOLIFY_ENV_UUID ;

      - name: Create or Get Coolify Service
        id: coolify_service
        run: |
          SERVICE_NAME="${{ steps.meta.outputs.service_name }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          PREVIEW_DOMAIN="${{ steps.meta.outputs.preview_domain }}"
          COMPOSE_CONTENT=$(base64 -w 0 deploy/docker-compose.preview.yml)

          EXISTING=$(curl -s \
            "https://coolify.yral.com/api/v1/services" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r --arg name "$SERVICE_NAME" '.[] | select(.name == $name) | .uuid // empty')

          if [ -n "$EXISTING" ]; then
            echo "Reusing existing Coolify service: $EXISTING"
            echo "service_uuid=${EXISTING}" >> "$GITHUB_OUTPUT"
          else
            RESPONSE=$(curl -s -X POST \
              "https://coolify.yral.com/api/v1/services" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "$(jq -n \
                --arg name "$SERVICE_NAME" \
                --arg project_uuid "$COOLIFY_PROJECT_UUID" \
                --arg server_uuid "$COOLIFY_SERVER_UUID" \
                --arg compose "$COMPOSE_CONTENT" \
                '{
                  "name": $name,
                  "project_uuid": $project_uuid,
                  "server_uuid": $server_uuid,
                  "environment_name": "preview",
                  "instant_deploy": false,
                  "docker_compose_raw": $compose
                }')")

            SERVICE_UUID=$(echo "$RESPONSE" | jq -r '.uuid // empty')

            if [ -z "$SERVICE_UUID" ]; then
              echo "Failed to create Coolify service"
              echo "$RESPONSE"
              exit 1
            fi

            echo "service_uuid=${SERVICE_UUID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Environment Variables
        env:
          STORJ_ACCESS_GRANT_SFW: ${{ secrets.STORJ_ACCESS_GRANT }}
          STORJ_ACCESS_GRANT_NSFW: ${{ secrets.STORJ_ACCESS_GRANT_NSFW }}
          SFW_BUCKET: yral-videos
          NSFW_BUCKET: yral-nsfw-videos
          SERVICE_SECRET_TOKEN: ${{ secrets.SERVICE_SECRET_TOKEN }}
          HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
          HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
          STORJ_EU1_GATEWAY_ACCESS_KEY: ${{ secrets.STORJ_EU1_GATEWAY_ACCESS_KEY }}
          STORJ_EU1_GATEWAY_SECRET_KEY: ${{ secrets.STORJ_EU1_GATEWAY_SECRET_KEY }}
          STORJ_MIRROR_ACCESS_GRANT: ${{ secrets.STORJ_MIRROR_ACCESS_GRANT }}
          ENVIRONMENT: staging
        run: |
          SERVICE_UUID="${{ steps.coolify_service.outputs.service_uuid }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"

          export POSTGRES_PASSWORD="preview_$(echo "$SERVICE_UUID" | cut -c1-8)"
          export DATABASE_URL="postgres://storj:${POSTGRES_PASSWORD}@postgres:5432/video_fingerprint_index"
          export APP_IMAGE="$IMAGE"
          export IMAGE_TAG="$IMAGE_TAG"
          export PREVIEW_DOMAIN="${{ steps.meta.outputs.preview_domain }}"
          export SERVICE_NAME="${{ steps.meta.outputs.service_name }}"
          # SFW_BUCKET, NSFW_BUCKET, HETZNER_* and other secrets are already in env via step env: block

          # Substitute all ${VAR} in compose with actual values and PATCH Coolify.
          # Coolify stores docker_compose_raw verbatim — it does NOT interpolate ${VAR} itself,
          # so the image name and Traefik labels would otherwise be literal "${APP_IMAGE}" etc.
          RESOLVED_COMPOSE=$(envsubst < deploy/docker-compose.preview.yml | base64 -w 0)
          COMPOSE_PATCH_RESP=$(curl -s -o /tmp/coolify-compose-response.txt -w "%{http_code}" -X PATCH \
            "https://coolify.yral.com/api/v1/services/${SERVICE_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg compose "$RESOLVED_COMPOSE" '{"docker_compose_raw": $compose}')")
          if [ "$COMPOSE_PATCH_RESP" -lt 200 ] || [ "$COMPOSE_PATCH_RESP" -ge 300 ]; then
            echo "Failed to patch compose (HTTP $COMPOSE_PATCH_RESP)"
            cat /tmp/coolify-compose-response.txt
            exit 1
          fi

          ENV_JSON=$(jq -n \
            --arg app_image "$IMAGE" \
            --arg image_tag "$IMAGE_TAG" \
            --arg postgres_password "$POSTGRES_PASSWORD" \
            --arg database_url "$DATABASE_URL" \
            --arg preview_domain "${{ steps.meta.outputs.preview_domain }}" \
            --arg service_name "${{ steps.meta.outputs.service_name }}" \
            --arg storj_access_grant_sfw "$STORJ_ACCESS_GRANT_SFW" \
            --arg storj_access_grant_nsfw "$STORJ_ACCESS_GRANT_NSFW" \
            --arg sfw_bucket "$SFW_BUCKET" \
            --arg nsfw_bucket "$NSFW_BUCKET" \
            --arg service_secret_token "$SERVICE_SECRET_TOKEN" \
            --arg hetzner_s3_endpoint "$HETZNER_S3_ENDPOINT" \
            --arg hetzner_s3_access_key "$HETZNER_S3_ACCESS_KEY" \
            --arg hetzner_s3_secret_key "$HETZNER_S3_SECRET_KEY" \
            --arg hetzner_s3_bucket "$HETZNER_S3_BUCKET" \
            --arg hetzner_s3_region "$HETZNER_S3_REGION" \
            --arg storj_eu1_gateway_access_key "$STORJ_EU1_GATEWAY_ACCESS_KEY" \
            --arg storj_eu1_gateway_secret_key "$STORJ_EU1_GATEWAY_SECRET_KEY" \
            --arg storj_mirror_access_grant "$STORJ_MIRROR_ACCESS_GRANT" \
            --arg environment "$ENVIRONMENT" \
            '{
              "data": [
                {"key": "APP_IMAGE", "value": $app_image, "is_literal": true},
                {"key": "IMAGE_TAG", "value": $image_tag, "is_literal": true},
                {"key": "POSTGRES_PASSWORD", "value": $postgres_password, "is_literal": true},
                {"key": "DATABASE_URL", "value": $database_url, "is_literal": true},
                {"key": "PREVIEW_DOMAIN", "value": $preview_domain, "is_literal": true},
                {"key": "SERVICE_NAME", "value": $service_name, "is_literal": true},
                {"key": "STORJ_ACCESS_GRANT_SFW", "value": $storj_access_grant_sfw, "is_literal": true},
                {"key": "STORJ_ACCESS_GRANT_NSFW", "value": $storj_access_grant_nsfw, "is_literal": true},
                {"key": "SFW_BUCKET", "value": $sfw_bucket, "is_literal": true},
                {"key": "NSFW_BUCKET", "value": $nsfw_bucket, "is_literal": true},
                {"key": "SERVICE_SECRET_TOKEN", "value": $service_secret_token, "is_literal": true},
                {"key": "HETZNER_S3_ENDPOINT", "value": $hetzner_s3_endpoint, "is_literal": true},
                {"key": "HETZNER_S3_ACCESS_KEY", "value": $hetzner_s3_access_key, "is_literal": true},
                {"key": "HETZNER_S3_SECRET_KEY", "value": $hetzner_s3_secret_key, "is_literal": true},
                {"key": "HETZNER_S3_BUCKET", "value": $hetzner_s3_bucket, "is_literal": true},
                {"key": "HETZNER_S3_REGION", "value": $hetzner_s3_region, "is_literal": true},
                {"key": "STORJ_EU1_GATEWAY_ACCESS_KEY", "value": $storj_eu1_gateway_access_key, "is_literal": true},
                {"key": "STORJ_EU1_GATEWAY_SECRET_KEY", "value": $storj_eu1_gateway_secret_key, "is_literal": true},
                {"key": "STORJ_MIRROR_ACCESS_GRANT", "value": $storj_mirror_access_grant, "is_literal": true},
                {"key": "ENVIRONMENT", "value": $environment, "is_literal": true}
              ]
            }')

          RESPONSE=$(curl -s -o /tmp/coolify-env-response.txt -w "%{http_code}" -X PATCH \
            "https://coolify.yral.com/api/v1/services/${SERVICE_UUID}/envs/bulk" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${ENV_JSON}")

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Failed to push environment variables (HTTP $RESPONSE)"
            cat /tmp/coolify-env-response.txt
            exit 1
          fi

      - name: Deploy
        run: |
          SERVICE_UUID="${{ steps.coolify_service.outputs.service_uuid }}"

          # Use restart so existing containers get stopped and restarted with updated env vars.
          # /start on an already-running service may be a no-op.
          RESPONSE=$(curl -s -o /tmp/coolify-deploy-response.txt -w "%{http_code}" -X POST \
            "https://coolify.yral.com/api/v1/services/${SERVICE_UUID}/restart" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json")

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Failed to restart Coolify service (HTTP $RESPONSE)"
            cat /tmp/coolify-deploy-response.txt
            exit 1
          fi

      - name: Route smoke check
        run: |
          curl --fail --retry 30 --retry-delay 10 --retry-all-errors --insecure \
            "${{ steps.meta.outputs.preview_url }}/api-docs/openapi.json" >/dev/null

          STATUS_CODE="$(curl --silent --insecure \
            --output /tmp/videogen-status-response.txt \
            --write-out "%{http_code}" \
            "${{ steps.meta.outputs.preview_url }}/api/v2/videogen/status/not-a-principal/all")"

          if [[ "${STATUS_CODE}" != "400" ]]; then
            echo "expected videogen invalid principal route to return 400, got ${STATUS_CODE}"
            cat /tmp/videogen-status-response.txt
            exit 1
          fi

  destroy_preview:
    if: ${{ github.event.pull_request.state == 'closed' }}
    runs-on: ubuntu-latest

    steps:
      - name: Compute Preview Metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.number }}
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          SERVICE_NAME="pr-${PR_NUMBER}-${REPO_NAME}"

          echo "service_name=${SERVICE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Import Coolify Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: yral-video-storage-service-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/COOLIFY_TOKEN value | COOLIFY_TOKEN ;

      - name: Find and Delete Coolify Service
        run: |
          SERVICE_NAME="${{ steps.meta.outputs.service_name }}"

          SERVICE_UUID=$(curl -s \
            "https://coolify.yral.com/api/v1/services" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r --arg name "$SERVICE_NAME" '.[] | select(.name == $name) | .uuid // empty')

          if [ -z "$SERVICE_UUID" ]; then
            echo "No Coolify service found for ${SERVICE_NAME}; skipping"
            exit 0
          fi

          RESPONSE=$(curl -s -o /tmp/coolify-delete-response.txt -w "%{http_code}" -X DELETE \
            "https://coolify.yral.com/api/v1/services/${SERVICE_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"delete_configurations": true, "delete_volumes": true}')

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Failed to delete Coolify service ${SERVICE_NAME} (HTTP $RESPONSE)"
            cat /tmp/coolify-delete-response.txt
            exit 1
          fi

  e2e-tests:
    if: ${{ github.event.pull_request.state == 'open' }}
    needs: preview
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit
    with:
      preview_url: ${{ needs.preview.outputs.url }}
      publisher: testuser-${{ github.sha }}
