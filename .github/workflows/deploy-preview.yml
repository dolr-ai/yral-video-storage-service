name: deploy preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  id-token: write
  pull-requests: write
  contents: read
  packages: write
  deployments: write

jobs:
  build_binary:
    if: ${{ github.event.pull_request.state == 'open' }}
    uses: ./.github/workflows/build-binary.yml
    with:
      publish-artifact: true

  preview:
    if: ${{ github.event.pull_request.state == 'open' }}
    needs: build_binary
    runs-on: ubuntu-latest

    outputs:
      url: ${{ steps.meta.outputs.preview_url }}

    concurrency:
      group: pr-${{ github.event.number }}-${{ github.event.repository.name }}
      cancel-in-progress: true

    environment:
      name: Deployment
      url: ${{ steps.meta.outputs.preview_url }}

    steps:
      - uses: actions/checkout@v4

      - name: Compute Preview Metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.number }}
          OWNER_NAME=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          IMAGE="ghcr.io/${OWNER_NAME}/${REPO_NAME}"
          IMAGE_TAG="pr-${PR_NUMBER}"
          PREVIEW_DOMAIN="pr-${PR_NUMBER}-${REPO_NAME}.preview.yral.com"
          PREVIEW_URL="https://${PREVIEW_DOMAIN}"
          APP_NAME="pr-${PR_NUMBER}-${REPO_NAME}"

          echo "pr_number=${PR_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "repo_name=${REPO_NAME}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"
          echo "preview_domain=${PREVIEW_DOMAIN}" >> "$GITHUB_OUTPUT"
          echo "preview_url=${PREVIEW_URL}" >> "$GITHUB_OUTPUT"
          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: built-binary

      - name: Place binary in expected path
        run: |
          mkdir -p target/x86_64-unknown-linux-musl/release
          mv storj-interface target/x86_64-unknown-linux-musl/release/storj-interface
          chmod +x target/x86_64-unknown-linux-musl/release/storj-interface

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.image_tag }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.image }}:cache-${{ steps.meta.outputs.image_tag }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.image }}:cache-${{ steps.meta.outputs.image_tag }},mode=max

      - name: Import Coolify Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: yral-video-storage-service-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/COOLIFY_TOKEN value | COOLIFY_TOKEN ;
            secret/data/COOLIFY_PROJECT_UUID value | COOLIFY_PROJECT_UUID ;
            secret/data/COOLIFY_SERVER_UUID value | COOLIFY_SERVER_UUID ;
            secret/data/COOLIFY_ENV_UUID value | COOLIFY_ENV_UUID ;

      - name: Create or Get Coolify Application
        id: coolify_app
        run: |
          APP_NAME="${{ steps.meta.outputs.app_name }}"
          IMAGE="${{ steps.meta.outputs.image }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"
          PREVIEW_DOMAIN="${{ steps.meta.outputs.preview_domain }}"

          EXISTING=$(curl -s \
            "https://coolify.yral.com/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r --arg name "$APP_NAME" '.[] | select(.name == $name) | .uuid // empty')

          if [ -n "$EXISTING" ]; then
            echo "Reusing existing Coolify app: $EXISTING"
            echo "app_uuid=${EXISTING}" >> "$GITHUB_OUTPUT"
          else
            RESPONSE=$(curl -s -X POST \
              "https://coolify.yral.com/api/v1/applications/dockerimage" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              -H "Content-Type: application/json" \
              -d "{
                \"name\": \"${APP_NAME}\",
                \"project_uuid\": \"${COOLIFY_PROJECT_UUID}\",
                \"server_uuid\": \"${COOLIFY_SERVER_UUID}\",
                \"environment_name\": \"preview\",
                \"environment_uuid\": \"${COOLIFY_ENV_UUID}\",
                \"docker_registry_image_name\": \"${IMAGE}\",
                \"docker_registry_image_tag\": \"${IMAGE_TAG}\",
                \"domains\": \"https://${PREVIEW_DOMAIN}\",
                \"ports_exposes\": \"3000\",
                \"is_static\": false
              }")

            APP_UUID=$(echo "$RESPONSE" | jq -r '.uuid // empty')

            if [ -z "$APP_UUID" ]; then
              echo "Failed to create Coolify application"
              echo "$RESPONSE"
              exit 1
            fi

            echo "app_uuid=${APP_UUID}" >> "$GITHUB_OUTPUT"
          fi

      - name: Push Environment Variables
        env:
          STORJ_ACCESS_GRANT_SFW: ${{ secrets.STORJ_ACCESS_GRANT }}
          STORJ_ACCESS_GRANT_NSFW: ${{ secrets.STORJ_ACCESS_GRANT }}
          SFW_BUCKET: yral-videos
          NSFW_BUCKET: yral-nsfw-videos
          SERVICE_SECRET_TOKEN: ${{ secrets.SERVICE_SECRET_TOKEN }}
          HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
          HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
          HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
          HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
          HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
          ENVIRONMENT: staging
        run: |
          APP_UUID="${{ steps.coolify_app.outputs.app_uuid }}"

          ENV_JSON=$(jq -n \
            --arg storj_access_grant_sfw "$STORJ_ACCESS_GRANT_SFW" \
            --arg storj_access_grant_nsfw "$STORJ_ACCESS_GRANT_NSFW" \
            --arg sfw_bucket "$SFW_BUCKET" \
            --arg nsfw_bucket "$NSFW_BUCKET" \
            --arg service_secret_token "$SERVICE_SECRET_TOKEN" \
            --arg hetzner_s3_endpoint "$HETZNER_S3_ENDPOINT" \
            --arg hetzner_s3_access_key "$HETZNER_S3_ACCESS_KEY" \
            --arg hetzner_s3_secret_key "$HETZNER_S3_SECRET_KEY" \
            --arg hetzner_s3_bucket "$HETZNER_S3_BUCKET" \
            --arg hetzner_s3_region "$HETZNER_S3_REGION" \
            --arg environment "$ENVIRONMENT" \
            '{
              "data": [
                {"key": "STORJ_ACCESS_GRANT_SFW", "value": $storj_access_grant_sfw, "is_literal": true},
                {"key": "STORJ_ACCESS_GRANT_NSFW", "value": $storj_access_grant_nsfw, "is_literal": true},
                {"key": "SFW_BUCKET", "value": $sfw_bucket, "is_literal": true},
                {"key": "NSFW_BUCKET", "value": $nsfw_bucket, "is_literal": true},
                {"key": "SERVICE_SECRET_TOKEN", "value": $service_secret_token, "is_literal": true},
                {"key": "HETZNER_S3_ENDPOINT", "value": $hetzner_s3_endpoint, "is_literal": true},
                {"key": "HETZNER_S3_ACCESS_KEY", "value": $hetzner_s3_access_key, "is_literal": true},
                {"key": "HETZNER_S3_SECRET_KEY", "value": $hetzner_s3_secret_key, "is_literal": true},
                {"key": "HETZNER_S3_BUCKET", "value": $hetzner_s3_bucket, "is_literal": true},
                {"key": "HETZNER_S3_REGION", "value": $hetzner_s3_region, "is_literal": true},
                {"key": "ENVIRONMENT", "value": $environment, "is_literal": true}
              ]
            }')

          RESPONSE=$(curl -s -o /tmp/coolify-env-response.txt -w "%{http_code}" -X PATCH \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}/envs/bulk" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "${ENV_JSON}")

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Failed to push environment variables (HTTP $RESPONSE)"
            cat /tmp/coolify-env-response.txt
            exit 1
          fi

      - name: Update Image Tag and Deploy
        id: deploy
        run: |
          APP_UUID="${{ steps.coolify_app.outputs.app_uuid }}"
          IMAGE_TAG="${{ steps.meta.outputs.image_tag }}"

          UPDATE_RESPONSE=$(curl -s -o /tmp/coolify-app-response.txt -w "%{http_code}" -X PATCH \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_registry_image_tag\": \"${IMAGE_TAG}\"}")

          if [ "$UPDATE_RESPONSE" -lt 200 ] || [ "$UPDATE_RESPONSE" -ge 300 ]; then
            echo "Failed to update Coolify image tag (HTTP $UPDATE_RESPONSE)"
            cat /tmp/coolify-app-response.txt
            exit 1
          fi

          RESPONSE=$(curl -s -X POST \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}/start" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"uuid\": \"${APP_UUID}\",
              \"force\": true
            }")

          DEPLOY_UUID=$(echo "$RESPONSE" | jq -r '.deployment_uuid // empty')
          if [ -z "$DEPLOY_UUID" ]; then
            echo "Failed to trigger deployment"
            echo "$RESPONSE"
            exit 1
          fi

          echo "deploy_uuid=${DEPLOY_UUID}" >> "$GITHUB_OUTPUT"

      - name: Wait for Deployment
        run: |
          DEPLOY_UUID="${{ steps.deploy.outputs.deploy_uuid }}"
          MAX_WAIT=180
          WAITED=0

          while [ "$WAITED" -lt "$MAX_WAIT" ]; do
            STATUS=$(curl -s \
              "https://coolify.yral.com/api/v1/deployments/${DEPLOY_UUID}" \
              -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
              | jq -r '.status // empty')

            echo "Status: ${STATUS} (${WAITED}s elapsed)"

            if [ "$STATUS" = "finished" ]; then
              exit 0
            fi

            if [ "$STATUS" = "failed" ] || [ "$STATUS" = "error" ]; then
              exit 1
            fi

            sleep 10
            WAITED=$((WAITED + 10))
          done

          echo "Timed out waiting for Coolify deployment"
          exit 1

  destroy_preview:
    if: ${{ github.event.pull_request.state == 'closed' }}
    runs-on: ubuntu-latest

    steps:
      - name: Compute Preview Metadata
        id: meta
        run: |
          PR_NUMBER=${{ github.event.number }}
          REPO_NAME=$(echo "${{ github.event.repository.name }}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9]/-/g')
          APP_NAME="pr-${PR_NUMBER}-${REPO_NAME}"

          echo "app_name=${APP_NAME}" >> "$GITHUB_OUTPUT"

      - name: Import Coolify Secrets from Vault
        uses: hashicorp/vault-action@v3
        with:
          url: https://vault.yral.com
          method: jwt
          role: yral-video-storage-service-role
          jwtGithubAudience: "https://github.com/dolr-ai"
          secrets: |
            secret/data/COOLIFY_TOKEN value | COOLIFY_TOKEN ;
            secret/data/COOLIFY_PROJECT_UUID value | COOLIFY_PROJECT_UUID ;
            secret/data/COOLIFY_SERVER_UUID value | COOLIFY_SERVER_UUID ;
            secret/data/COOLIFY_ENV_UUID value | COOLIFY_ENV_UUID ;

      - name: Find and Delete Coolify Application
        run: |
          APP_NAME="${{ steps.meta.outputs.app_name }}"

          APP_UUID=$(curl -s \
            "https://coolify.yral.com/api/v1/applications" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            | jq -r --arg name "$APP_NAME" '.[] | select(.name == $name) | .uuid // empty')

          if [ -z "$APP_UUID" ]; then
            echo "No Coolify app found for ${APP_NAME}; skipping"
            exit 0
          fi

          RESPONSE=$(curl -s -o /tmp/coolify-delete-response.txt -w "%{http_code}" -X DELETE \
            "https://coolify.yral.com/api/v1/applications/${APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}")

          if [ "$RESPONSE" -lt 200 ] || [ "$RESPONSE" -ge 300 ]; then
            echo "Failed to delete Coolify application ${APP_NAME} (HTTP $RESPONSE)"
            cat /tmp/coolify-delete-response.txt
            exit 1
          fi

  e2e-tests:
    if: ${{ github.event.pull_request.state == 'open' }}
    needs: preview
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit
    with:
      preview_url: ${{ needs.preview.outputs.url }}
      publisher: testuser-${{ github.sha }}
