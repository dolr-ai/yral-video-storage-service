name: Deploy Preview (Prakash)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-prakash-${{ github.event.number }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVER_1_IP: 94.130.13.115
  SERVER_2_IP: 88.99.151.102
  SERVER_3_IP: 138.201.129.173
  APP_DIR: /home/deploy/storj-interface
  HOST_PORT: 3005
  PREVIEW_URL: https://storage-interface.prakash.yral.com

jobs:
  build-and-push:
    if: github.event.pull_request.state == 'open'
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install ffmpeg dev libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libavformat-dev libavcodec-dev libavutil-dev libswscale-dev \
            libavfilter-dev libavdevice-dev libswresample-dev \
            clang pkg-config

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        run: cargo clippy -- -D warnings

      - name: Test
        run: cargo test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}-cache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}-cache,mode=max

  deploy:
    if: github.event.pull_request.state == 'open'
    name: Deploy HA Preview
    needs: [build-and-push]
    runs-on: ubuntu-latest
    environment: Deployment
    permissions:
      contents: read
      packages: read
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      POSTGRES_SUPERUSER_PASSWORD: ${{ secrets.POSTGRES_SUPERUSER_PASSWORD }}
      REPLICATOR_PASSWORD: ${{ secrets.REPLICATOR_PASSWORD }}
      APP_DB_PASSWORD: ${{ secrets.APP_DB_PASSWORD }}
      PATRONI_API_PASSWORD: ${{ secrets.PATRONI_API_PASSWORD }}
      STORJ_ACCESS_GRANT: ${{ secrets.STORJ_ACCESS_GRANT }}
      STORJ_ACCESS_GRANT_NSFW: ${{ secrets.STORJ_ACCESS_GRANT_NSFW }}
      HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
      HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
      HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
      SERVICE_SECRET_TOKEN: ${{ secrets.SERVICE_SECRET_TOKEN }}
      STORJ_EU1_GATEWAY_ACCESS_KEY: ${{ secrets.STORJ_EU1_GATEWAY_ACCESS_KEY }}
      STORJ_EU1_GATEWAY_SECRET_KEY: ${{ secrets.STORJ_EU1_GATEWAY_SECRET_KEY }}
      STORJ_MIRROR_ACCESS_GRANT: ${{ secrets.STORJ_MIRROR_ACCESS_GRANT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PRAKASH }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Clean up old preview containers on server_1
        run: |
          ssh-keyscan -H "${SERVER_1_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "deploy@${SERVER_1_IP}" "
            docker ps -q --filter name=storj-interface-preview | xargs -r docker stop || true
            docker ps -aq --filter name=storj-interface-preview | xargs -r docker rm || true
            docker ps -q --filter name=yral-video-storage-service-storj-interface | xargs -r docker stop || true
            docker ps -aq --filter name=yral-video-storage-service-storj-interface | xargs -r docker rm || true
          "

      - name: Deploy HA to all nodes
        run: |
          declare -A SERVERS
          SERVERS=(["server_1"]="${SERVER_1_IP}" ["server_2"]="${SERVER_2_IP}" ["server_3"]="${SERVER_3_IP}")

          for NODE_NAME in server_1 server_2 server_3; do
            NODE_IP="${SERVERS[$NODE_NAME]}"
            echo "--> ${NODE_NAME} (${NODE_IP})"
            ssh-keyscan -H "${NODE_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true

            ssh "deploy@${NODE_IP}" "mkdir -p ${APP_DIR}"
            scp -r deploy "deploy@${NODE_IP}:${APP_DIR}/"

            RUN_APP=false
            [[ "${NODE_NAME}" == "server_1" ]] && RUN_APP=true

            APP_VARS=""
            if [[ "${RUN_APP}" == "true" ]]; then
              APP_VARS="\
                export STORJ_ACCESS_GRANT_SFW='${STORJ_ACCESS_GRANT}'; \
                export STORJ_ACCESS_GRANT_NSFW='${STORJ_ACCESS_GRANT_NSFW}'; \
                export HETZNER_S3_ENDPOINT='${HETZNER_S3_ENDPOINT}'; \
                export HETZNER_S3_BUCKET='${HETZNER_S3_BUCKET}'; \
                export HETZNER_S3_ACCESS_KEY='${HETZNER_S3_ACCESS_KEY}'; \
                export HETZNER_S3_SECRET_KEY='${HETZNER_S3_SECRET_KEY}'; \
                export HETZNER_S3_REGION='${HETZNER_S3_REGION}'; \
                export SERVICE_SECRET_TOKEN='${SERVICE_SECRET_TOKEN}'; \
                export STORJ_EU1_GATEWAY_ACCESS_KEY='${STORJ_EU1_GATEWAY_ACCESS_KEY}'; \
                export STORJ_EU1_GATEWAY_SECRET_KEY='${STORJ_EU1_GATEWAY_SECRET_KEY}'; \
                export STORJ_MIRROR_ACCESS_GRANT='${STORJ_MIRROR_ACCESS_GRANT}';"
            fi

            ssh "deploy@${NODE_IP}" \
              "export SERVER_1_IP='${SERVER_1_IP}'; \
               export SERVER_2_IP='${SERVER_2_IP}'; \
               export SERVER_3_IP='${SERVER_3_IP}'; \
               export NODE_NAME='${NODE_NAME}'; \
               export NODE_IP='${NODE_IP}'; \
               export POSTGRES_SUPERUSER_PASSWORD='${POSTGRES_SUPERUSER_PASSWORD}'; \
               export REPLICATOR_PASSWORD='${REPLICATOR_PASSWORD}'; \
               export APP_DB_PASSWORD='${APP_DB_PASSWORD}'; \
               export PATRONI_API_PASSWORD='${PATRONI_API_PASSWORD}'; \
               export IMAGE_TAG='pr-${{ github.event.number }}'; \
               export APP_IMAGE='ghcr.io/${{ env.IMAGE_NAME }}'; \
               export RUN_APP='${RUN_APP}'; \
               export HOST_PORT='${HOST_PORT}'; \
               ${APP_VARS} \
               echo '${GITHUB_TOKEN}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
               bash '${APP_DIR}/deploy/scripts/deploy/deploy-ha.sh'"
          done

      - name: Health check
        run: |
          ssh-keyscan -H "${SERVER_1_IP}" >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "deploy@${SERVER_1_IP}" \
            "curl --fail --retry 30 --retry-delay 5 --retry-all-errors \
              http://localhost:${HOST_PORT}/health" || \
          (ssh "deploy@${SERVER_1_IP}" \
            "cd ${APP_DIR}/deploy && COMPOSE_PROJECT_NAME=yral-video-storage-service docker compose -f docker-compose.ha.yml logs --tail=50 storj-interface 2>/dev/null" && exit 1)

  e2e-tests:
    if: github.event.pull_request.state == 'open'
    needs: deploy
    uses: ./.github/workflows/e2e-tests.yml
    secrets: inherit
    with:
      preview_url: https://storage-interface.prakash.yral.com
      publisher: testuser-${{ github.sha }}

  destroy-preview:
    if: github.event.pull_request.state == 'closed'
    name: Destroy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY_PRAKASH }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Stop storj-interface on server_1
        run: |
          ssh-keyscan -H ${{ env.SERVER_1_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true
          ssh "deploy@${{ env.SERVER_1_IP }}" "
            cd ${{ env.APP_DIR }}/deploy 2>/dev/null || exit 0
            docker compose -f docker-compose.ha.yml --profile app stop storj-interface || true
            docker compose -f docker-compose.ha.yml --profile app rm -f storj-interface || true
          "

      - name: Delete preview image from GHCR
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const tag = `pr-${{ github.event.number }}`;
              const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                package_type: 'container',
                package_name: context.repo.repo,
                org: context.repo.owner,
              });
              const version = versions.find(v => v.metadata?.container?.tags?.includes(tag));
              if (version) {
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container',
                  package_name: context.repo.repo,
                  org: context.repo.owner,
                  package_version_id: version.id,
                });
              }
            } catch (e) {
              console.log('Could not delete preview image:', e.message);
            }
