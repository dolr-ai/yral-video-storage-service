name: Deploy Preview (Prakash)

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: preview-prakash-${{ github.event.number }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  SERVER_1_IP: 94.130.13.115
  APP_DIR: /home/deploy/storj-interface-preview
  HOST_PORT: 3005
  PREVIEW_URL: https://storj-interface-preview.prakash.yral.com

jobs:
  deploy-preview:
    if: github.event.pull_request.state == 'open'
    name: Deploy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      STORJ_ACCESS_GRANT: ${{ secrets.STORJ_ACCESS_GRANT }}
      HETZNER_S3_ENDPOINT: ${{ secrets.HETZNER_S3_ENDPOINT }}
      HETZNER_S3_BUCKET: ${{ secrets.HETZNER_S3_BUCKET }}
      HETZNER_S3_ACCESS_KEY: ${{ secrets.HETZNER_S3_ACCESS_KEY }}
      HETZNER_S3_SECRET_KEY: ${{ secrets.HETZNER_S3_SECRET_KEY }}
      HETZNER_S3_REGION: ${{ secrets.HETZNER_S3_REGION }}
      SERVICE_SECRET_TOKEN: ${{ secrets.SERVICE_SECRET_TOKEN }}
      POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
      STORJ_GATEWAY_ACCESS_KEY: ${{ secrets.STORJ_GATEWAY_ACCESS_KEY }}
      STORJ_GATEWAY_SECRET_KEY: ${{ secrets.STORJ_GATEWAY_SECRET_KEY }}
      STORJ_MIRROR_ACCESS_GRANT: ${{ secrets.STORJ_MIRROR_ACCESS_GRANT }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./deploy/Dockerfile
          push: true
          tags: ${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}
          cache-from: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}-cache
          cache-to: type=registry,ref=${{ env.DOCKER_REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.number }}-cache,mode=max

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.SERVER_1_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Sync deployment files to server
        run: |
          ssh "deploy@${{ env.SERVER_1_IP }}" "mkdir -p ${{ env.APP_DIR }}"
          scp deploy/docker-compose.yml "deploy@${{ env.SERVER_1_IP }}:${{ env.APP_DIR }}/"

      - name: Deploy preview
        run: |
          ssh "deploy@${{ env.SERVER_1_IP }}" \
            "export APP_IMAGE='ghcr.io/${{ github.repository }}'; \
             export IMAGE_TAG='pr-${{ github.event.number }}'; \
             export HOST_PORT='${{ env.HOST_PORT }}'; \
             export STORJ_ACCESS_GRANT_SFW='${STORJ_ACCESS_GRANT}'; \
             export STORJ_ACCESS_GRANT_NSFW='${STORJ_ACCESS_GRANT}'; \
             export SFW_BUCKET='yral-videos'; \
             export NSFW_BUCKET='yral-nsfw-videos'; \
             export HETZNER_S3_ENDPOINT='${HETZNER_S3_ENDPOINT}'; \
             export HETZNER_S3_BUCKET='${HETZNER_S3_BUCKET}'; \
             export HETZNER_S3_ACCESS_KEY='${HETZNER_S3_ACCESS_KEY}'; \
             export HETZNER_S3_SECRET_KEY='${HETZNER_S3_SECRET_KEY}'; \
             export HETZNER_S3_REGION='${HETZNER_S3_REGION}'; \
             export SERVICE_SECRET_TOKEN='${SERVICE_SECRET_TOKEN}'; \
             export POSTGRES_PASSWORD='${POSTGRES_PASSWORD}'; \
             export STORJ_GATEWAY_ACCESS_KEY='${STORJ_GATEWAY_ACCESS_KEY}'; \
             export STORJ_GATEWAY_SECRET_KEY='${STORJ_GATEWAY_SECRET_KEY}'; \
             export STORJ_MIRROR_ACCESS_GRANT='${STORJ_MIRROR_ACCESS_GRANT}'; \
             export ENVIRONMENT='staging'; \
             cd ${{ env.APP_DIR }} && \
             echo '${GITHUB_TOKEN}' | docker login ghcr.io -u '${{ github.actor }}' --password-stdin && \
             docker compose down --remove-orphans || true; \
             docker compose pull && \
             docker compose up -d --remove-orphans"

      - name: Health check
        run: |
          ssh "deploy@${{ env.SERVER_1_IP }}" \
            "curl --fail --retry 5 --retry-delay 5 --retry-connrefused \
              http://localhost:${{ env.HOST_PORT }}/health"

      - name: Comment preview URL on PR
        uses: actions/github-script@v7
        with:
          script: |
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const marker = '<!-- deploy-preview-prakash -->';
            const existing = comments.find(c => c.body.includes(marker));
            const body = `${marker}\n🚀 **Preview deployed:** ${{ env.PREVIEW_URL }}\n\n**Test commands (HMAC-SHA256 signed):**\n\`\`\`bash\n# Health check (no auth)\ncurl ${{ env.PREVIEW_URL }}/health\n\n# Signed request helper\nhmac_sign() {\n  local method=$1 path=$2\n  local ts=$(date +%s)\n  local sig=$(printf "%s\\n%s\\n%s" "$method" "$path" "$ts" | openssl dgst -sha256 -hmac "$SERVICE_SECRET_TOKEN" | awk '{ print $NF }')\n  echo "-H \\"X-Timestamp: $ts\\" -H \\"Authorization: HMAC-SHA256 $sig\\""\n}\n\n# Audit\ncurl $(hmac_sign GET /mirror/audit) ${{ env.PREVIEW_URL }}/mirror/audit\n\n# Trigger scan-hetzner\ncurl -X POST $(hmac_sign POST /mirror/jobs/scan-hetzner) ${{ env.PREVIEW_URL }}/mirror/jobs/scan-hetzner\n\`\`\``;
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

  destroy-preview:
    if: github.event.pull_request.state == 'closed'
    name: Destroy Preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.SERVER_1_IP }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Tear down preview
        run: |
          ssh "deploy@${{ env.SERVER_1_IP }}" "
            cd ${{ env.APP_DIR }} 2>/dev/null || exit 0
            docker compose down -v --remove-orphans || true
            cd / && rm -rf ${{ env.APP_DIR }}
          "

      - name: Delete preview image from GHCR
        uses: actions/github-script@v7
        with:
          script: |
            try {
              const tag = `pr-${{ github.event.number }}`;
              const { data: versions } = await github.rest.packages.getAllPackageVersionsForPackageOwnedByOrg({
                package_type: 'container',
                package_name: context.repo.repo,
                org: context.repo.owner,
              });
              const version = versions.find(v => v.metadata?.container?.tags?.includes(tag));
              if (version) {
                await github.rest.packages.deletePackageVersionForOrg({
                  package_type: 'container',
                  package_name: context.repo.repo,
                  org: context.repo.owner,
                  package_version_id: version.id,
                });
              }
            } catch (e) {
              console.log('Could not delete preview image:', e.message);
            }
