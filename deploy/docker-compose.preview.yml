services:
  storj-interface:
    image: ${APP_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
      STORJ_ACCESS_GRANT_SFW: ${STORJ_ACCESS_GRANT_SFW}
      SFW_BUCKET: ${SFW_BUCKET}
      STORJ_ACCESS_GRANT_NSFW: ${STORJ_ACCESS_GRANT_NSFW}
      NSFW_BUCKET: ${NSFW_BUCKET}
      HETZNER_S3_ENDPOINT: ${HETZNER_S3_ENDPOINT}
      HETZNER_S3_BUCKET: ${HETZNER_S3_BUCKET}
      HETZNER_S3_ACCESS_KEY: ${HETZNER_S3_ACCESS_KEY}
      HETZNER_S3_SECRET_KEY: ${HETZNER_S3_SECRET_KEY}
      HETZNER_S3_REGION: ${HETZNER_S3_REGION}
      SERVICE_SECRET_TOKEN: ${SERVICE_SECRET_TOKEN}
      ENVIRONMENT: ${ENVIRONMENT}
      STORJ_EU1_GATEWAY_ACCESS_KEY: ${STORJ_EU1_GATEWAY_ACCESS_KEY}
      STORJ_EU1_GATEWAY_SECRET_KEY: ${STORJ_EU1_GATEWAY_SECRET_KEY}
      STORJ_MIRROR_ACCESS_GRANT: ${STORJ_MIRROR_ACCESS_GRANT}
