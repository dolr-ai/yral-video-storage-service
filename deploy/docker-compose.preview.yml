services:
  storj-interface:
    image: ${APP_IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=coolify"
      - "traefik.http.routers.${SERVICE_NAME}.rule=Host(`${PREVIEW_DOMAIN}`)"
      - "traefik.http.routers.${SERVICE_NAME}.entrypoints=websecure"
      - "traefik.http.routers.${SERVICE_NAME}.tls=true"
      - "traefik.http.routers.${SERVICE_NAME}.tls.certresolver=letsencrypt"
      - "traefik.http.services.${SERVICE_NAME}.loadbalancer.server.port=3000"
    environment:
      DATABASE_URL: postgres://storj:storjpreview@postgres:5432/video_fingerprint_index
      STORJ_ACCESS_GRANT_SFW: ${STORJ_ACCESS_GRANT_SFW}
      SFW_BUCKET: ${SFW_BUCKET}
      STORJ_ACCESS_GRANT_NSFW: ${STORJ_ACCESS_GRANT_NSFW}
      NSFW_BUCKET: ${NSFW_BUCKET}
      HETZNER_S3_ENDPOINT: ${HETZNER_S3_ENDPOINT}
      HETZNER_S3_BUCKET: ${HETZNER_S3_BUCKET}
      HETZNER_S3_ACCESS_KEY: ${HETZNER_S3_ACCESS_KEY}
      HETZNER_S3_SECRET_KEY: ${HETZNER_S3_SECRET_KEY}
      HETZNER_S3_REGION: ${HETZNER_S3_REGION}
      SERVICE_SECRET_TOKEN: ${SERVICE_SECRET_TOKEN}
      ENVIRONMENT: ${ENVIRONMENT}
      STORJ_EU1_GATEWAY_ACCESS_KEY: ${STORJ_EU1_GATEWAY_ACCESS_KEY}
      STORJ_EU1_GATEWAY_SECRET_KEY: ${STORJ_EU1_GATEWAY_SECRET_KEY}
      STORJ_MIRROR_ACCESS_GRANT: ${STORJ_MIRROR_ACCESS_GRANT}
    networks:
      - storj-net
      - coolify

  postgres:
    image: postgres:16-alpine
    tmpfs:
      - /var/lib/postgresql/data
    environment:
      POSTGRES_DB: video_fingerprint_index
      POSTGRES_USER: storj
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_INITDB_ARGS: "--auth-host=trust --auth-local=trust"
    networks:
      - storj-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U storj -d video_fingerprint_index"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

networks:
  storj-net:
    driver: bridge
  coolify:
    external: true
