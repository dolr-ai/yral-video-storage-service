[package]
name = "storj-interface"
version = "0.1.0"
edition = "2021"

[workspace]
members = [".", "crates/backfill-thumbnails", "crates/phash", "crates/mirror-client"]

[lib]
name = "storj_interface"
path = "src/lib.rs"

[[bin]]
name = "storj-interface"  # Same as lib name
path = "src/main.rs"

[dependencies]
anyhow = "1.0.97"
async-trait = "0.1"
aws-config = { version = "1.5", features = ["behavior-version-latest"] }
# `default-features = false` avoids the `rustls` feature, which routes TLS through
# the legacy rustls-0.21 / rustls-webpki-0.101 stack (GHSA / Dependabot #21).
# `default-https-client` selects the modern rustls-aws-lc (rustls-0.23) path instead.
aws-sdk-s3 = { version = "1.64", default-features = false, features = ["default-https-client", "rt-tokio", "sigv4a", "http-1x"] }
axum = { version = "0.8.1", features = ["multipart"] }
base64 = "0.22"
bytes = "1.8"
# Profile-image decode/resize/encode. Default features so arbitrary user uploads
# (jpeg/png/webp/gif) decode; output is always JPEG. See routes/user/profile_s3.rs.
image = "0.25"
chrono = "0.4"
futures = "0.3"
futures-util = "0.3.31"
http-body-util = "0.1"
once_cell = "1.21.1"
# using rustls-tls because we wanna cross-compile to musl, otherwise openssl becomes a pain
reqwest = { version = "0.12.15", default-features = false, features = ["rustls-tls", "stream", "multipart"] }
sentry = { version = "0.42.0", default-features = false, features = [
    "rustls",
    "anyhow",
    "backtrace",
    "contexts",
    "debug-images",
    "panic",
    "reqwest",
] }
sentry-tower = { version = "0.42.0", features = ["http"] }
sentry-tracing = "0.42.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
phash = { path = "crates/phash" }
rand = "0.8"
tempfile = "3"
tokio-postgres = { version = "0.7.15", features = ["with-chrono-0_4", "with-serde_json-1"] }
tokio-util = { version = "0.7", features = ["rt"] }
thiserror = "2.0.12"
tower = "0.5"
tokio = { version = "1.52.0", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tower-http = { version = "0.6", features = ["cors"] }
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
aes-gcm = "0.10"
uuid = { version = "1", features = ["v4", "serde"] }
utoipa = { version = "5.3.1", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "9.0.2", features = ["axum"] }
# IC / canister deps
candid = "0.10.6"
ic-agent = "0.41.0"
k256 = { version = "0.13.3", features = ["jwk"] }
yral-canisters-client = { git = "https://github.com/dolr-ai/yral-common.git", branch = "main", features = ["full"] }
yral-types = { git = "https://github.com/dolr-ai/yral-common", branch = "main" }
stringreader = "0.1.1"
lapin = { version = "4", default-features = false, features = ["rustls--ring", "tokio"] }
# Activate tcp-stream's async TLS path (rustls-futures) which lapin's rustls--ring feature omits.
# Without this, lapin's AMQPS connect falls through to a plain TCP stream and the broker
# responds to the bare AMQP header with a TLS alert (7 bytes) that parses as Nom(MapOpt).
tcp-stream = { version = "0.34", default-features = false, features = ["rustls-futures", "rustls--ring", "tokio"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
refinery = { version = "0.9.2", features = ["tokio-postgres"] }
deadpool-postgres = "0.14.1"
